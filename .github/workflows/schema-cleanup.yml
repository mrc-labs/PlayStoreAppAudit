name: One-time canonical table schema cleanup

on:
  push:
    branches: ["refactor/v0.12-schema"]
    paths:
      - "tools/centralize_table_schema.py"
      - ".github/workflows/schema-cleanup.yml"

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout schema branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/v0.12-schema

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply canonical schema migration
        shell: pwsh
        run: python tools/centralize_table_schema.py

      - name: Format, test, lint and smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff format playstore_app_audit tests main.py
          ruff check --fix playstore_app_audit tests main.py
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; from playstore_app_audit.ui import schema; app=QApplication([]); w=MainWindow(); assert w.model.columnCount()==len(schema.MODEL_COLUMNS); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Device'); assert w.status_label.text()==old; print('Canonical schema Qt smoke OK'); w.close()"

      - name: Remove one-time migration machinery
        shell: pwsh
        run: |
          Remove-Item tools/centralize_table_schema.py
          Remove-Item .github/workflows/schema-cleanup.yml
          if (Test-Path tools -PathType Container) {
            if (-not (Get-ChildItem tools -Force | Select-Object -First 1)) { Remove-Item tools }
          }

      - name: Commit validated schema migration
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Centralize immutable Qt table schema"
          git push origin HEAD:refactor/v0.12-schema
