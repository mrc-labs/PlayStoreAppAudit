name: Build Linux - Qt6 (manual)

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit SHA expected for this deliberate build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            expected_elf_machine: Advanced Micro Devices X86-64
            managed_adb: true
          - os: ubuntu-24.04-arm
            arch: arm64
            expected_elf_machine: AArch64
            managed_adb: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify requested build commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          dispatch="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

          if [[ "$dispatch" != "$expected" ]]; then
            echo "The dispatched ref resolved to $dispatch, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          if [[ "$actual" != "$expected" ]]; then
            echo "Checkout produced $actual, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          echo "Release-candidate source SHA verified: $actual"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Read canonical project version
        id: project_version
        run: |
          VERSION="$(python -c 'from playstore_app_audit import __version__; print(__version__)')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Linux runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            unzip \
            xauth \
            xvfb \
            zip
          if [ "${{ matrix.managed_adb }}" != "true" ]; then sudo apt-get install -y adb; fi
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "Nuitka==4.1.3"
      - name: Preflight release legal material
        run: |
          python .github/scripts/preflight_release_legal_material.py \
            --repo-root "$PWD" \
            --expected-nuitka-version "4.1.3"
      - name: Test shared source and Qt event loop
        env:
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py
          python main.py
      - name: Validate ADB path for this architecture
        run: |
          python - <<'PY'
          import subprocess
          from playstore_app_audit.devices.adb import find_adb, install_platform_tools
          from playstore_app_audit.platform.runtime import managed_platform_tools_download_supported, machine_key
          expected = '${{ matrix.arch }}'
          assert machine_key() == expected
          if managed_platform_tools_download_supported():
              adb, version = install_platform_tools(); print(version)
          else:
              adb = find_adb(); assert adb, 'native ADB is required and was not found'
          result = subprocess.run([adb, 'version'], capture_output=True, text=True, timeout=20)
          print(result.stdout)
          assert result.returncode == 0 and 'Android Debug Bridge' in result.stdout
          PY
      - name: Generate Linux icon
        run: python -c "from app_icon import generate_app_icon; print(generate_app_icon('app_icon.png', 256))"
      - name: Configure Qt deployment
        run: |
          pyside6-deploy main.py --name PlayStoreAppAudit --init
          python - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path
          p=ConfigParser(); p.read('pysidedeploy.spec')
          p['app']['exec_directory']=str(Path('dist').resolve())
          p['app']['icon']=str(Path('app_icon.png').resolve())
          p['nuitka']['mode']='standalone'
          p['nuitka']['extra_args']='--quiet --noinclude-qt-translations --noinclude-qt-plugins=platforminputcontexts --nofollow-import-to=PIL --assume-yes-for-downloads --report=compilation-report.xml'
          with open('pysidedeploy.spec','w',encoding='utf-8') as f: p.write(f)
          PY
      - name: Build, inspect and smoke packaged Linux standalone tree
        env:
          APP_VERSION: ${{ steps.project_version.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          set -euo pipefail

          mkdir -p dist artifact package roundtrip
          pyside6-deploy -c pysidedeploy.spec -f
          test -s compilation-report.xml

          STANDALONE_DIR="$(find dist -maxdepth 1 -type d -name '*.dist' -print -quit)"
          test -n "$STANDALONE_DIR"

          find "$STANDALONE_DIR" -type f -name 'libqpdf.so*' -print -delete

          if find "$STANDALONE_DIR" -type f -name 'libqpdf.so*' -print -quit | grep -q .; then
            echo "Qt PDF image plugin pruning failed." >&2
            exit 1
          fi

          if find "$STANDALONE_DIR" -path '*platforminputcontexts*' -print -quit | grep -q .; then
            echo "Qt Virtual Keyboard runtime exclusion failed." >&2
            exit 1
          fi

          BIN="$(find "$STANDALONE_DIR" -maxdepth 1 -type f \
            \( -name 'PlayStoreAppAudit' \
            -o -name 'PlayStoreAppAudit.bin' \
            -o -name 'main' \
            -o -name 'main.bin' \) -print -quit)"

          test -n "$BIN"
          test "$(stat -c%s "$BIN")" -gt 1048576
          chmod +x "$BIN"

          file "$BIN"

          ELF_MACHINE="$(readelf -h "$BIN" |
            awk -F: '/Machine:/{sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          echo "ELF machine architecture: $ELF_MACHINE"
          test "$ELF_MACHINE" = "${{ matrix.expected_elf_machine }}"
          export PACKAGE_ELF_MACHINE="$ELF_MACHINE"

          "$BIN"

          PACKAGE_NAME="PlayStoreAppAudit-v${APP_VERSION}-linux-${PACKAGE_ARCH}"
          PACKAGE_DIR="package/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"
          cp -a "$STANDALONE_DIR/." "$PACKAGE_DIR/"

          SOURCE_BIN_NAME="$(basename "$BIN")"
          PACKAGE_BIN="$PACKAGE_DIR/PlayStoreAppAudit"

          if [ "$SOURCE_BIN_NAME" != "PlayStoreAppAudit" ]; then
            mv "$PACKAGE_DIR/$SOURCE_BIN_NAME" "$PACKAGE_BIN"
          fi

          chmod +x "$PACKAGE_BIN"
          test -x "$PACKAGE_BIN"

          QT_CORE="$(find "$PACKAGE_DIR" -type f             -name 'libQt6Core.so*' -print -quit)"
          PYSIDE_LIB="$(find "$PACKAGE_DIR" -type f             -name 'libpyside6*.so*' -print -quit)"
          SHIBOKEN_LIB="$(find "$PACKAGE_DIR" -type f             -name 'libshiboken6*.so*' -print -quit)"

          test -n "$QT_CORE"
          test -n "$PYSIDE_LIB"
          test -n "$SHIBOKEN_LIB"

          echo "Qt Core shared library: $QT_CORE"
          echo "PySide6 shared library: $PYSIDE_LIB"
          echo "Shiboken6 shared library: $SHIBOKEN_LIB"

          python - <<'PY' > "$PACKAGE_DIR/BUILD-INFO.txt"
          import os
          import platform
          import sys
          from importlib.metadata import version

          import PySide6

          print('Application version:', os.environ['APP_VERSION'])
          print('GitHub SHA:', os.environ.get('GITHUB_SHA', 'unavailable'))
          print('GitHub ref:', os.environ.get('GITHUB_REF', 'unavailable'))
          print('GitHub ref name:', os.environ.get('GITHUB_REF_NAME', 'unavailable'))
          print('Runner OS:', os.environ.get('RUNNER_OS', 'unavailable'))
          print('Runner image OS:', os.environ.get('ImageOS', 'unavailable'))
          print('Runner image version:', os.environ.get('ImageVersion', 'unavailable'))
          print(
              'Build/test host OS:',
              platform.freedesktop_os_release().get(
                  'PRETTY_NAME',
                  platform.platform(),
              ),
          )
          print('Build/test host kernel:', platform.platform())
          print('Package architecture:', os.environ['PACKAGE_ARCH'])
          print(
              'ELF machine architecture:',
              os.environ['PACKAGE_ELF_MACHINE'],
          )
          print('Build host architecture:', platform.machine())
          print('Python:', sys.version.replace('\n', ' '))
          print('PySide6:', PySide6.__version__)
          print('Nuitka:', version('Nuitka'))
          PY

          LEGAL_RELEASE_DIR="$PWD/artifact/legal-release-v${APP_VERSION}"

          python .github/scripts/prepare_release_legal_bundle.py \
            --package-dir "$PACKAGE_DIR" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --repo-root "$PWD" \
            --release-tag "v${APP_VERSION}" \
            --nuitka-report "$PWD/compilation-report.xml" \
            --inject

          python .github/scripts/validate_release_legal_bundle.py \
            --package-dir "$PACKAGE_DIR" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --public

          SOURCE_SUMS="$LEGAL_RELEASE_DIR/source-assets/SHA256SUMS.txt"
          SOURCE_BUNDLE="$LEGAL_RELEASE_DIR/PlayStoreAppAudit-v${APP_VERSION}-third-party-sources.tar.xz"

          test -s "$SOURCE_SUMS"
          test -s "$SOURCE_BUNDLE"

          test -f "$PACKAGE_DIR/LICENSE"
          test -f "$PACKAGE_DIR/THIRD_PARTY_NOTICES.md"
          test -f "$PACKAGE_DIR/SOURCE-AVAILABILITY.md"
          test -d "$PACKAGE_DIR/licenses"

          test ! -e "$PACKAGE_DIR/LEGAL-MANIFEST.json"
          test ! -e "$PACKAGE_DIR/validation-evidence"

          ARCHIVE="$PWD/artifact/$PACKAGE_NAME.zip"

          (
            cd package
            zip -qr "$ARCHIVE" "$PACKAGE_NAME"
          )

          test "$(stat -c%s "$ARCHIVE")" -gt 1048576

          unzip -q "$ARCHIVE" -d roundtrip

          ROUNDTRIP_DIR="roundtrip/$PACKAGE_NAME"
          ROUNDTRIP_BIN="$ROUNDTRIP_DIR/PlayStoreAppAudit"

          test -x "$ROUNDTRIP_BIN"
          test -f "$ROUNDTRIP_DIR/BUILD-INFO.txt"

          test -f "$ROUNDTRIP_DIR/LICENSE"
          test -f "$ROUNDTRIP_DIR/THIRD_PARTY_NOTICES.md"
          test -f "$ROUNDTRIP_DIR/SOURCE-AVAILABILITY.md"
          test -d "$ROUNDTRIP_DIR/licenses"

          test ! -e "$ROUNDTRIP_DIR/LEGAL-MANIFEST.json"
          test ! -e "$ROUNDTRIP_DIR/validation-evidence"

          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libQt6Core.so*' -print -quit)"
          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libpyside6*.so*' -print -quit)"
          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libshiboken6*.so*' -print -quit)"

          ROUNDTRIP_MACHINE="$(readelf -h "$ROUNDTRIP_BIN" |
            awk -F: '/Machine:/{sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          test "$ROUNDTRIP_MACHINE" = "${{ matrix.expected_elf_machine }}"

          timeout 30s xvfb-run -a             env QT_QPA_PLATFORM=xcb "$ROUNDTRIP_BIN"

          sha256sum "$ARCHIVE"
          ls -lh artifact/*

      - uses: actions/upload-artifact@v7
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-linux-${{ matrix.arch }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
