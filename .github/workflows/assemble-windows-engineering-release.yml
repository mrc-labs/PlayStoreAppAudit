name: Assemble Windows engineering release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact final-main commit SHA used by the Windows x64 engineering candidate
        required: true
        type: string
      windows_run_id:
        description: Successful Build Windows - Qt6 run ID containing the unsigned x64 artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  assemble:
    name: Validate and assemble Windows x64 engineering release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify final-main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          dispatch="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "Windows engineering release assembly must be dispatched from main, got $DISPATCH_REF." >&2
            exit 1
          fi

          if [[ "$dispatch" != "$expected" ]]; then
            echo "Dispatch SHA $dispatch does not match expected_sha $expected." >&2
            exit 1
          fi

          if [[ "$actual" != "$expected" ]]; then
            echo "Checkout SHA $actual does not match expected_sha $expected." >&2
            exit 1
          fi

          echo "Final-main Windows x64 engineering release SHA verified: $actual"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Read canonical project version
        id: project_version
        run: |
          set -euo pipefail

          version="$(python -c 'from playstore_app_audit import __version__; print(__version__)')"
          metadata_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"

          test -n "$version"
          test "$version" = "$metadata_version"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Project version is not a numeric SemVer triplet: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Verify unsigned Windows source workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
          VERSION: ${{ steps.project_version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          expected_sha = os.environ["EXPECTED_SHA"].strip().casefold()
          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          raw_id = os.environ["WINDOWS_RUN_ID"].strip()
          version = os.environ["VERSION"]

          if not raw_id.isdigit() or int(raw_id) <= 0:
              raise RuntimeError("Windows run ID must be a positive integer")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{raw_id}",
              headers=headers,
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              run = json.load(response)

          failures = []
          if run.get("name") != "Build Windows - Qt6":
              failures.append(
                  f"workflow name {run.get('name')!r} != 'Build Windows - Qt6'"
              )
          if run.get("event") != "workflow_dispatch":
              failures.append(
                  f"event {run.get('event')!r} != 'workflow_dispatch'"
              )
          if run.get("status") != "completed":
              failures.append(
                  f"status {run.get('status')!r} != 'completed'"
              )
          if run.get("conclusion") != "success":
              failures.append(
                  f"conclusion {run.get('conclusion')!r} != 'success'"
              )

          actual_sha = str(run.get("head_sha", "")).casefold()
          if actual_sha != expected_sha:
              failures.append(
                  f"head_sha {actual_sha!r} != {expected_sha!r}"
              )

          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict):
              failures.append("head_repository is missing")
          elif head_repository.get("full_name") != repository:
              failures.append(
                  "head repository "
                  f"{head_repository.get('full_name')!r} != {repository!r}"
              )

          artifacts_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/runs/{raw_id}/artifacts?per_page=100",
              headers=headers,
          )
          with urllib.request.urlopen(artifacts_request, timeout=30) as response:
              artifacts_payload = json.load(response)

          artifact_names = {
              str(item.get("name", ""))
              for item in artifacts_payload.get("artifacts", [])
          }
          expected_x64 = f"PlayStoreAppAudit-v{version}-windows-x64"
          unexpected_arm64 = f"PlayStoreAppAudit-v{version}-windows-arm64"
          if expected_x64 not in artifact_names:
              failures.append(f"required x64 artifact {expected_x64!r} is missing")
          if unexpected_arm64 in artifact_names:
              failures.append(
                  "source run contains a Windows ARM64 artifact; v1.4 engineering must be built with target=x64 only"
              )

          if failures:
              raise RuntimeError(
                  f"Windows run {raw_id} rejected: " + "; ".join(failures)
              )

          print(
              f"Windows x64 run {raw_id}: completed/success at {actual_sha}"
          )
          PY

      - name: Compile Windows engineering release assembler
        run: |
          python -m py_compile \
            .github/scripts/assemble_windows_engineering_release.py \
            .github/scripts/assemble_release_assets.py \
            .github/scripts/release_asset_layout.py

      - name: Download unsigned Windows x64 engineering candidate
        uses: actions/download-artifact@v8
        with:
          pattern: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-x64
          path: rc-input/windows
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Assemble and validate three-file engineering asset set
        env:
          VERSION: ${{ steps.project_version.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail

          python .github/scripts/assemble_windows_engineering_release.py \
            --input-dir rc-input \
            --output-dir final-release \
            --version "$VERSION" \
            --expected-sha "$EXPECTED_SHA"

          python .github/scripts/release_asset_layout.py validate \
            --asset-dir final-release \
            --version "$VERSION"

          asset_count="$(
            find final-release -maxdepth 1 -type f -printf '.' |
            wc -c |
            tr -d '[:space:]'
          )"
          test "$asset_count" = "3"

          if find final-release -mindepth 1 -maxdepth 1 -type d -print -quit |
            grep -q .
          then
            echo "Final engineering release output unexpectedly contains directories." >&2
            exit 1
          fi

          echo "Windows x64 engineering release asset set contains exactly 3 files."

      - name: Write engineering release summary
        env:
          VERSION: ${{ steps.project_version.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: |
          {
            echo "### Play Store App Audit v${VERSION} Windows x64 engineering release"
            echo
            echo "- Exact final-main SHA: \`${EXPECTED_SHA}\`"
            echo "- Unsigned Windows source run: \`${WINDOWS_RUN_ID}\`"
            echo "- Windows architecture: x64 only"
            echo "- Signing: intentionally deferred to v1.5"
            echo "- Final asset count: 3"
            echo
            echo '```text'
            cat final-release/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated Windows engineering release assets
        uses: actions/upload-artifact@v7
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-x64-engineering-release-assets
          path: final-release/
          if-no-files-found: error
          retention-days: 30
