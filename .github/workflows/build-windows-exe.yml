name: Build Windows EXE - CustomTkinter

on:
  workflow_dispatch:
  push:
    branches: [customtkinter]
    paths:
      - "app_icon.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_user_state.py"
      - "playstore_audit_v8_features.py"
      - "playstore_audit_gui.py"
      - "playstore_audit_windows.py"
      - "playstore_audit_customtkinter.py"
      - "playstore_audit_customtkinter_branch.py"
      - "playstore_audit_customtkinter_v8.py"
      - "playstore_audit_customtkinter_launcher.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit CustomTkinter.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and CustomTkinter UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_user_state.py
          python -m py_compile playstore_audit_v8_features.py
          python -m py_compile playstore_audit_gui.py
          python -m py_compile playstore_audit_windows.py
          python -m py_compile playstore_audit_customtkinter.py
          python -m py_compile playstore_audit_customtkinter_branch.py
          python -m py_compile playstore_audit_customtkinter_v8.py
          python -m py_compile playstore_audit_customtkinter_launcher.py
          python -c "import playstore_audit_v8_features as f; assert f.parse_country_list('ch, it, uk, us')[0]==['ch','it','gb','us']; assert f.compare_versions('1.2.3','1.2.3')=='Match'; assert f.compare_versions('1.2.3','Varies with device')=='Device-specific'; print('Shared v8 helpers OK')"
          python -c "import playstore_audit_customtkinter_v8 as m; import playstore_audit_user_state as s; w=m.CustomTkPlayStoreAuditV8(); w.update_idletasks(); assert tuple(w.tree['columns'])==m.V8_MODEL_COLUMNS; assert all(c in m.V8_MODEL_COLUMNS for c in ('play_version','installed_version','version_comparison','installer_source')); assert s.DEFAULT_SETTINGS['fallback_countries']; assert s.DEFAULT_SETTINGS['collect_device_metadata'] is True; assert int(w.workers_var.get())==16; assert w.path_entry.cget('placeholder_text'); w.current_rows=[{'criticality':'●  Current','criticality_key':'green','criticality_rank':5,'package_name':'com.example.test','play_title':'Test','play_last_update':'2026-08-01','age_days':14,'notes':'','change':'','play_status':'available','updated_source':'test','play_http_status':200,'app_name':'Test','store_url':'','is_system':False,'play_version':'1.0','installed_version':'1.0','version_comparison':'Match','installer_source':'Google Play'}]; w._refresh_table(); assert len(w.tree.get_children())==1; print('CustomTkinter v8 smoke test OK'); w.destroy()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-CustomTkinter `
            --icon app_icon.ico `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            --collect-all customtkinter `
            playstore_audit_customtkinter_launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-CustomTkinter
          path: dist/PlayStoreAppAudit-CustomTkinter.exe
          if-no-files-found: error
          retention-days: 30
