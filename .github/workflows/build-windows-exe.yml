name: Build Windows EXE - Qt6

on:
  workflow_dispatch:
  push:
    branches: [qt6]
    paths:
      - "app_icon.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_user_state.py"
      - "playstore_audit_v8_features.py"
      - "playstore_audit_qt.py"
      - "playstore_audit_qt_branch.py"
      - "playstore_audit_qt_compact.py"
      - "playstore_audit_qt_v8.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit Qt6.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and Qt UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_user_state.py
          python -m py_compile playstore_audit_v8_features.py
          python -m py_compile playstore_audit_qt.py
          python -m py_compile playstore_audit_qt_branch.py
          python -m py_compile playstore_audit_qt_compact.py
          python -m py_compile playstore_audit_qt_v8.py
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "import playstore_audit_v8_features as f; assert f.parse_country_list('ch, it, uk, us')[0]==['ch','it','gb','us']; assert f.compare_versions('1.2.3','1.2.3')=='Match'; assert f.compare_versions('1.2.3','Varies with device')=='Device-specific'; print('Shared v8 helpers OK')"
          python -c "from PySide6.QtWidgets import QApplication; import playstore_audit_qt_v8 as m; import playstore_audit_user_state as s; app=QApplication([]); w=m.PlayStoreAuditQtV8(); assert w.workers_spin.value()==16; assert w.model.columnCount()==len(m.V8_MODEL_COLUMNS); assert all(c in m.V8_MODEL_COLUMNS for c in ('play_version','installed_version','version_comparison','installer_source')); assert s.DEFAULT_SETTINGS['fallback_countries']; assert s.DEFAULT_SETTINGS['collect_device_metadata'] is True; assert [a.text() for a in w.menuBar().actions()]==['File','Tools','Help']; tools=w.menuBar().actions()[1].menu(); labels=[a.text() for a in tools.actions() if a.text()]; assert 'Force full refresh (ignore cache)' in labels; assert 'Recheck Removed / Anomaly / Other' in labels; assert 'Clear previous-audit history' in labels; assert w.table.verticalHeader().defaultSectionSize()==24; print('Qt6 v8 smoke test OK'); w.close()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-Qt6 `
            --icon app_icon.ico `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            playstore_audit_qt_v8.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-Qt6
          path: dist/PlayStoreAppAudit-Qt6.exe
          if-no-files-found: error
          retention-days: 30
