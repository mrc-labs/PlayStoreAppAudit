name: Build Windows EXE - CustomTkinter

on:
  workflow_dispatch:
  push:
    branches: [customtkinter]
    paths:
      - "playstore_audit_core.py"
      - "playstore_audit_gui.py"
      - "playstore_audit_windows.py"
      - "playstore_audit_customtkinter.py"
      - "playstore_audit_customtkinter_branch.py"
      - "playstore_audit_customtkinter_launcher.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit CustomTkinter.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and CustomTkinter UI
        shell: pwsh
        run: |
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_gui.py
          python -m py_compile playstore_audit_windows.py
          python -m py_compile playstore_audit_customtkinter.py
          python -m py_compile playstore_audit_customtkinter_branch.py
          python -m py_compile playstore_audit_customtkinter_launcher.py
          python -c "import playstore_audit_customtkinter_branch as m; w=m.CustomTkPlayStoreAuditBranch(); w.update_idletasks(); assert w.language_var.get() == 'en'; assert int(w.workers_var.get()) == 16; assert 'app_name' not in w.tree['displaycolumns']; w.current_rows=[{'app_name':'Test','package_name':'com.example.test','play_status':'available','play_last_update':'2026-08-01','age_days':14,'play_title':'Test','updated_source':'test','notes':'','criticality':'🟢 Current','criticality_key':'green','criticality_rank':5,'is_system':False,'store_url':''}]; w._refresh_table(); assert len(w.tree.get_children()) == 1; print('CustomTkinter compact table smoke test OK'); w.destroy()"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-CustomTkinter `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            --collect-all customtkinter `
            playstore_audit_customtkinter_launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-CustomTkinter
          path: dist/PlayStoreAppAudit-CustomTkinter.exe
          if-no-files-found: error
          retention-days: 30
