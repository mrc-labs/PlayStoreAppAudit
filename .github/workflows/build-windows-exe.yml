name: Build Windows EXE - CustomTkinter

on:
  workflow_dispatch:
  push:
    branches: [customtkinter]
    paths:
      - "playstore_audit_core.py"
      - "playstore_audit_gui.py"
      - "playstore_audit_windows.py"
      - "playstore_audit_customtkinter.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit CustomTkinter.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and CustomTkinter UI
        shell: pwsh
        run: |
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_gui.py
          python -m py_compile playstore_audit_windows.py
          python -m py_compile playstore_audit_customtkinter.py
          python -c "import customtkinter; import playstore_audit_customtkinter as m; w=m.CustomTkPlayStoreAuditApp(); w.update_idletasks(); assert w.language_var.get() == 'en'; print('CustomTkinter window smoke test OK'); w.destroy()"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-CustomTkinter `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            --collect-all customtkinter `
            playstore_audit_customtkinter.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-CustomTkinter
          path: dist/PlayStoreAppAudit-CustomTkinter.exe
          if-no-files-found: error
          retention-days: 30
