name: Build Windows - Qt6

on:
  workflow_dispatch:
    inputs:
      target:
        description: Windows architecture to build
        required: false
        default: x64
        type: choice
        options:
          - x64
          - arm64
          - both
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - "build_windows_exe.bat"
      - ".github/scripts/inspect_pe.py"
      - ".github/scripts/validate_windows_standalone.py"
      - ".github/scripts/build_windows_standalone.ps1"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows ${{ matrix.arch }} standalone package
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'push' && '["x64"]' || inputs.target == 'both' && '["x64", "arm64"]' || inputs.target == 'arm64' && '["arm64"]' || '["x64"]') }}
    runs-on: ${{ matrix.arch == 'x64' && 'windows-2025' || 'windows-11-arm' }}
    env:
      PACKAGE_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER_ARCH: ${{ matrix.arch == 'x64' && 'X64' || 'ARM64' }}
      EXPECTED_PLATFORM_MACHINE: ${{ matrix.arch == 'x64' && 'AMD64' || 'ARM64' }}
      EXPECTED_PE_MACHINE: ${{ matrix.arch == 'x64' && '0x8664' || '0xAA64' }}
      PYSIDE_WHEEL_PLATFORM: ${{ matrix.arch == 'x64' && 'win_amd64' || 'win_arm64' }}
      RUNNER_LABEL: ${{ matrix.arch == 'x64' && 'windows-2025' || 'windows-11-arm' }}
      RUNNER_STATUS: ${{ matrix.arch == 'x64' && 'generally available' || 'public preview' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up native Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify native Python architecture
        shell: pwsh
        run: |
          $pythonExe = python -c "import sys; print(sys.executable)"
          $reportedMachine = python -c "import platform; print(platform.machine().upper())"
          $pointerBits = python -c "import struct; print(struct.calcsize('P') * 8)"
          $pythonPlatform = python -c "import sysconfig; print(sysconfig.get_platform())"
          python -c "import sys, sysconfig; print(sys.version); assert sys.version_info[:2] == (3, 13); assert not sysconfig.get_config_var('Py_GIL_DISABLED')"
          if ($LASTEXITCODE -ne 0) { throw 'Standard Python 3.13 verification failed.' }
          if ($env:RUNNER_ARCH -ne $env:EXPECTED_RUNNER_ARCH) {
            throw "Expected runner architecture $env:EXPECTED_RUNNER_ARCH, but RUNNER_ARCH is $env:RUNNER_ARCH."
          }
          if ($reportedMachine -ne $env:EXPECTED_PLATFORM_MACHINE) {
            throw "Expected native $env:EXPECTED_PLATFORM_MACHINE Python, but platform.machine() reported $reportedMachine."
          }
          if ($pointerBits -ne '64') { throw "Expected 64-bit Python, but found $pointerBits-bit Python." }

          $pythonPeArchitecture = python .github/scripts/inspect_pe.py --expect $env:EXPECTED_PE_MACHINE $pythonExe
          if ($LASTEXITCODE -ne 0) { throw 'Python executable PE architecture verification failed.' }
          Write-Host "Python executable: $pythonExe"
          Write-Host "Python PE architecture: $pythonPeArchitecture"
          "PYTHON_REPORTED_MACHINE=$reportedMachine" >> $env:GITHUB_ENV
          "PYTHON_PLATFORM_TAG=$pythonPlatform" >> $env:GITHUB_ENV
          "PYTHON_PE_ARCHITECTURE=$pythonPeArchitecture" >> $env:GITHUB_ENV

      - name: Read and verify canonical project version
        id: project_version
        shell: pwsh
        run: |
          $version = python -c "from playstore_app_audit import __version__; print(__version__)"
          $metadataVersion = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          if (-not $version) { throw 'Project version is empty.' }
          if ($version -ne $metadataVersion) {
            throw "Package version $version does not match pyproject.toml version $metadataVersion."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Project version is not a numeric SemVer triplet: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install runtime, test and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'Could not upgrade pip.' }
          python -m pip install -r requirements-dev.txt "Nuitka==4.1.3"
          if ($LASTEXITCODE -ne 0) { throw 'Could not install project/build dependencies.' }

      - name: Verify native PySide6 runtime
        shell: pwsh
        run: |
          python -c "import sys, PySide6; print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info[:2] == (3, 13); assert tuple(map(int, PySide6.__version__.split('.')[:2])) >= (6, 11)"
          if ($LASTEXITCODE -ne 0) { throw 'PySide6 import or version verification failed.' }

          $wheelTags = @(python -c "from importlib.metadata import distribution; print(*[line.removeprefix('Tag: ') for line in distribution('PySide6-Essentials').read_text('WHEEL').splitlines() if line.startswith('Tag: ')], sep='\n')")
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect the PySide6-Essentials wheel metadata.' }
          $nativeWheelTag = $wheelTags | Where-Object { $_ -match "-$([regex]::Escape($env:PYSIDE_WHEEL_PLATFORM))$" } | Select-Object -First 1
          if (-not $nativeWheelTag) {
            throw "PySide6-Essentials is not installed from a $env:PYSIDE_WHEEL_PLATFORM wheel. Found: $($wheelTags -join ', ')"
          }

          $qtCoreBinary = python -c "from PySide6 import QtCore; print(QtCore.__file__)"
          $qtCorePeArchitecture = python .github/scripts/inspect_pe.py --expect $env:EXPECTED_PE_MACHINE $qtCoreBinary
          if ($LASTEXITCODE -ne 0) { throw 'QtCore native extension PE architecture verification failed.' }
          Write-Host "PySide6-Essentials wheel tag: $nativeWheelTag"
          Write-Host "QtCore PE architecture: $qtCorePeArchitecture"
          "PYSIDE6_WHEEL_TAG=$nativeWheelTag" >> $env:GITHUB_ENV
          "PYSIDE6_QTCORE_PE_ARCHITECTURE=$qtCorePeArchitecture" >> $env:GITHUB_ENV

      - name: Static checks and regression tests
        shell: pwsh
        run: |
          python -m compileall -q playstore_app_audit
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed.' }
          python -m py_compile .github/scripts/inspect_pe.py .github/scripts/validate_windows_standalone.py
          if ($LASTEXITCODE -ne 0) { throw 'Build helper compilation failed.' }
          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed.' }
          ruff check playstore_app_audit tests main.py .github/scripts/inspect_pe.py .github/scripts/validate_windows_standalone.py
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed.' }

      - name: Qt source smoke tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); assert w.path_edit.isHidden(); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Device'); assert w.status_label.text()==old; assert w.country_edit.text(); print('Qt package smoke test OK'); w.close()"
          if ($LASTEXITCODE -ne 0) { throw 'Qt widget smoke test failed.' }
          python main.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt event-loop smoke test failed.' }

      - name: Validate the managed ADB path
        shell: pwsh
        run: |
          $adbScript = @'
          from pathlib import Path

          from playstore_app_audit.devices.adb import install_platform_tools, run_adb
          from playstore_app_audit.platform.runtime import (
              adb_executable_name,
              managed_platform_tools_dir,
              managed_platform_tools_download_supported,
          )

          assert managed_platform_tools_download_supported(), "managed Platform-Tools must be enabled on Windows"
          adb, _installed_version = install_platform_tools()
          actual_path = Path(adb).resolve()
          expected_path = (managed_platform_tools_dir() / adb_executable_name()).resolve()
          assert actual_path == expected_path, f"managed ADB path mismatch: {actual_path} != {expected_path}"
          result = run_adb(str(actual_path), "version", timeout=20)
          version_lines = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          assert version_lines and "Android Debug Bridge" in version_lines[0]
          print(actual_path)
          print(" | ".join(version_lines))
          '@
          $adbDetails = @($adbScript | python -)
          if ($LASTEXITCODE -ne 0) { throw 'The application managed ADB path failed validation.' }
          if ($adbDetails.Count -ne 2) { throw "Unexpected managed ADB validation output: $($adbDetails -join ' | ')" }

          $adbPath = $adbDetails[0]
          $adbVersion = $adbDetails[1]
          $adbPeArchitecture = python .github/scripts/inspect_pe.py $adbPath
          if ($LASTEXITCODE -ne 0) { throw 'Managed adb.exe PE inspection failed.' }

          if ($env:PACKAGE_ARCH -eq 'arm64') {
            if ($adbPeArchitecture -like 'IMAGE_FILE_MACHINE_ARM64*') {
              $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully as a native ARM64 executable.'
            } elseif ($adbPeArchitecture -like 'IMAGE_FILE_MACHINE_AMD64*') {
              $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully through Windows ARM64 x64 emulation.'
            } elseif ($adbPeArchitecture -like 'IMAGE_FILE_MACHINE_I386*') {
              $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully through Windows ARM64 x86 emulation.'
            } else {
              $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully; its exact PE machine is recorded separately.'
            }
          } elseif ($adbPeArchitecture -like 'IMAGE_FILE_MACHINE_AMD64*') {
            $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully as a native x64 executable.'
          } elseif ($adbPeArchitecture -like 'IMAGE_FILE_MACHINE_I386*') {
            $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully through the Windows x86 compatibility layer (WOW64).'
          } else {
            $adbExecution = 'Google Windows Platform-Tools adb.exe ran successfully; its exact PE machine is recorded separately.'
          }

          Write-Host "Managed ADB path: $adbPath"
          Write-Host "Managed ADB PE architecture: $adbPeArchitecture"
          Write-Host $adbExecution
          "MANAGED_ADB_PATH=$adbPath" >> $env:GITHUB_ENV
          "MANAGED_ADB_VERSION=$adbVersion" >> $env:GITHUB_ENV
          "MANAGED_ADB_PE_ARCHITECTURE=$adbPeArchitecture" >> $env:GITHUB_ENV
          "MANAGED_ADB_EXECUTION=$adbExecution" >> $env:GITHUB_ENV

          $summary = @"
          ### Windows $env:PACKAGE_ARCH managed ADB validation

          - Path: ``$adbPath``
          - PE architecture: $adbPeArchitecture
          - Result: $adbExecution
          "@
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Build and validate Windows standalone package
        shell: pwsh
        run: |
          $pythonExe = (Get-Command python).Source
          $outputRoot = "artifact\windows-$env:PACKAGE_ARCH-ci"

          & .\.github\scripts\build_windows_standalone.ps1 `
            -PythonExe $pythonExe `
            -RepoRoot $PWD.Path `
            -OutputRoot $outputRoot `
            -ExpectedPeMachine $env:EXPECTED_PE_MACHINE `
            -ExpectedPlatformMachine $env:EXPECTED_PLATFORM_MACHINE `
            -PackageArch $env:PACKAGE_ARCH `
            -UseMSVC

          if ($LASTEXITCODE -ne 0) { throw 'Standalone package build failed.' }

          $version = '${{ steps.project_version.outputs.version }}'
          $zipName = "PlayStoreAppAudit-v$version-windows-$env:PACKAGE_ARCH.zip"
          $zipPath = Join-Path $outputRoot $zipName
          $checksumPath = "$zipPath.sha256"

          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Expected ZIP artifact was not produced: $zipPath"
          }
          if (-not (Test-Path -LiteralPath $checksumPath)) {
            throw "Expected SHA-256 sidecar was not produced: $checksumPath"
          }

          $checksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          Write-Host "Final package: $zipPath"
          Write-Host "Checksum: $checksum"

          @"
          ### Windows $env:PACKAGE_ARCH standalone package

          - Packaging: Nuitka standalone ZIP
          - Compiler: MSVC latest
          - Package: ``$zipName``
          - SHA-256: ``$checksum``
          - Qt Virtual Keyboard: excluded and validated absent
          - Qt PDF image plugin qpdf.dll: removed and validated absent
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows standalone ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-${{ matrix.arch }}
          path: |
            artifact/windows-${{ matrix.arch }}-ci/PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-${{ matrix.arch }}.zip
            artifact/windows-${{ matrix.arch }}-ci/PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
