name: Build Windows - Qt6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Test and build Windows x64 package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Read canonical project version
        id: project_version
        shell: pwsh
        run: |
          $version = python -c "from playstore_app_audit import __version__; print(__version__)"
          if (-not $version) { throw 'Project version is empty.' }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify current runtime versions
        shell: pwsh
        run: |
          python -c "import sys, PySide6; print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info >= (3,13); assert tuple(map(int, PySide6.__version__.split('.')[:2])) >= (6,11)"

      - name: Static checks and regression tests
        shell: pwsh
        run: |
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py

      - name: Qt offscreen smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); assert w.path_edit.isHidden(); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Device'); assert w.status_label.text()==old; assert w.country_edit.text(); print('Qt package smoke test OK'); w.close()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Initialise Qt deployment configuration
        shell: pwsh
        run: |
          pyside6-deploy main.py --name PlayStoreAppAudit --init
          python -c "from configparser import ConfigParser; from pathlib import Path; p=ConfigParser(); p.read('pysidedeploy.spec'); p['app']['exec_directory']=str(Path('dist').resolve()); p['app']['icon']=str(Path('app_icon.ico').resolve()); p['nuitka']['mode']='onefile'; p['nuitka']['extra_args']='--quiet --noinclude-qt-translations --windows-console-mode=disable --nofollow-import-to=PIL --assume-yes-for-downloads'; f=open('pysidedeploy.spec','w',encoding='utf-8'); p.write(f); f.close()"

      - name: Build optimized Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pyside6-deploy -c pysidedeploy.spec -f
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          $exe = Get-ChildItem -Path dist -Recurse -Filter *.exe | Where-Object { $_.Name -match 'PlayStoreAppAudit|main' } | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No deployed executable found.' }
          $version = '${{ steps.project_version.outputs.version }}'
          $outputName = "PlayStoreAppAudit-v$version-windows-x64.exe"
          $outputPath = Join-Path artifact $outputName
          Copy-Item $exe.FullName $outputPath
          $sizeMB = [math]::Round((Get-Item $outputPath).Length / 1MB, 2)
          Write-Host "Final executable size: $sizeMB MB"

          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PLAYSTORE_APP_AUDIT_SMOKE_TEST = '1'
          $process = Start-Process -FilePath $outputPath -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            $process.WaitForExit()
            throw 'Packaged Windows executable did not finish its smoke test within 60 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged Windows executable smoke test failed with exit code $($process.ExitCode)."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $outputPath).Hash.ToLowerInvariant()
          "$hash  $outputName" | Set-Content -Encoding ascii "$outputPath.sha256"

          $pythonVersion = python -c "import sys; print(sys.version.replace(chr(10), ' '))"
          $pysideVersion = python -c "import PySide6; print(PySide6.__version__)"
          $nuitkaVersion = python -c "from importlib.metadata import version; print(version('Nuitka'))"
          @(
            "Application version: $version"
            "GitHub SHA: $env:GITHUB_SHA"
            "GitHub ref: $env:GITHUB_REF"
            "GitHub ref name: $env:GITHUB_REF_NAME"
            "Runner OS: $env:RUNNER_OS"
            "Runner image OS: $env:ImageOS"
            "Runner image version: $env:ImageVersion"
            "Build/test host OS: $([System.Environment]::OSVersion.VersionString)"
            "Package architecture: x64"
            "Build host architecture: $env:PROCESSOR_ARCHITECTURE"
            "Python: $pythonVersion"
            "PySide6: $pysideVersion"
            "Nuitka: $nuitkaVersion"
            "Signing: unsigned CI artifact"
          ) | Set-Content -Encoding utf8 artifact/BUILD-INFO-windows-x64.txt

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
