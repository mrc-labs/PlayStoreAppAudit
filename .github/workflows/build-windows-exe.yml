name: Build Windows EXE - Qt6

on:
  workflow_dispatch:
  push:
    branches: [qt6]
    paths:
      - "app_icon.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_qt.py"
      - "playstore_audit_qt_branch.py"
      - "playstore_audit_qt_compact.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit Qt6.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and Qt UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_qt.py
          python -m py_compile playstore_audit_qt_branch.py
          python -m py_compile playstore_audit_qt_compact.py
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from PySide6.QtWidgets import QApplication; import playstore_audit_qt_compact as m; app=QApplication([]); w=m.PlayStoreAuditQtCompact(); assert w.workers_spin.value()==16; assert tuple(m.qt_base.COLUMNS)==m.DISPLAY_COLUMNS; assert w.model.columnCount()==6; assert m.qt_base.COLUMN_LABELS['criticality']=='Status'; assert w.table.verticalHeader().defaultSectionSize()==26; assert not w.windowIcon().isNull(); assert w.country_edit.parentWidget() is w.path_edit.parentWidget(); assert w.exclude_system_source_check.parentWidget() is w.path_edit.parentWidget(); row={'play_status':'available_in_other_country'}; m.qt_base.classify_criticality(row); assert row['criticality_key']=='blue'; row={'play_status':'not_found_in_checked_countries'}; m.qt_base.classify_criticality(row); assert row['criticality_key']=='red'; w._audit_active=True; w._audit_paused=False; w._audit_pause_event.set(); w._last_progress=(2,10,'x'); w._toggle_pause(); assert w._audit_paused and not w._audit_pause_event.is_set() and w.run_button.text()=='Resume'; w._toggle_pause(); assert (not w._audit_paused) and w._audit_pause_event.is_set() and w.run_button.text()=='Pause'; w._audit_active=False; w._set_run_mode('run'); assert w.run_button.text()=='Run Play Store audit'; print('Qt6 columns/pause smoke test OK'); w.close()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-Qt6 `
            --icon app_icon.ico `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            playstore_audit_qt_compact.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-Qt6
          path: dist/PlayStoreAppAudit-Qt6.exe
          if-no-files-found: error
          retention-days: 30
