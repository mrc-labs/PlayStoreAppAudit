name: Build Windows EXE - CustomTkinter

on:
  workflow_dispatch:
  push:
    branches: [customtkinter]
    paths:
      - "app_icon.py"
      - "playstore_audit_process.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_user_state.py"
      - "playstore_audit_v8_features.py"
      - "playstore_audit_v9_features.py"
      - "playstore_audit_v9_2_features.py"
      - "playstore_audit_v9_3_features.py"
      - "playstore_audit_gui.py"
      - "playstore_audit_windows.py"
      - "playstore_audit_customtkinter.py"
      - "playstore_audit_customtkinter_branch.py"
      - "playstore_audit_customtkinter_v8.py"
      - "playstore_audit_customtkinter_v9.py"
      - "playstore_audit_customtkinter_v9_stable.py"
      - "playstore_audit_customtkinter_v9_fixed.py"
      - "playstore_audit_customtkinter_v9_2.py"
      - "playstore_audit_customtkinter_v9_3.py"
      - "playstore_audit_customtkinter_launcher.py"
      - "playstore_audit_customtkinter_v9_launcher.py"
      - "playstore_audit_customtkinter_v9_2_launcher.py"
      - "playstore_audit_customtkinter_v9_3_launcher.py"
      - "hook-tkinterdnd2.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit CustomTkinter.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and CustomTkinter v9.3 UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_process.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_user_state.py
          python -m py_compile playstore_audit_v8_features.py
          python -m py_compile playstore_audit_v9_features.py
          python -m py_compile playstore_audit_v9_2_features.py
          python -m py_compile playstore_audit_v9_3_features.py
          python -m py_compile playstore_audit_gui.py
          python -m py_compile playstore_audit_windows.py
          python -m py_compile playstore_audit_customtkinter.py
          python -m py_compile playstore_audit_customtkinter_branch.py
          python -m py_compile playstore_audit_customtkinter_v8.py
          python -m py_compile playstore_audit_customtkinter_v9.py
          python -m py_compile playstore_audit_customtkinter_v9_stable.py
          python -m py_compile playstore_audit_customtkinter_v9_fixed.py
          python -m py_compile playstore_audit_customtkinter_v9_2.py
          python -m py_compile playstore_audit_customtkinter_v9_3.py
          python -m py_compile playstore_audit_customtkinter_launcher.py
          python -m py_compile playstore_audit_customtkinter_v9_launcher.py
          python -m py_compile playstore_audit_customtkinter_v9_2_launcher.py
          python -m py_compile playstore_audit_customtkinter_v9_3_launcher.py
          python -c "import playstore_audit_v9_2_features as f; import playstore_audit_v9_3_features as f3; assert f.format_date_value('Aug 1, 2026','YYYY-MM-DD')=='2026-08-01'; assert 'Phone-only methods' in f.CSV_EXPORT_GUIDE; assert f3.device_change_count({'had_previous':True,'counts':{'new':1,'removed':2,'version':1,'installer':0,'state':0}})==4; print('Shared v9.3 helpers OK')"
          python -c "import subprocess; import playstore_audit_customtkinter_v9_3 as m; w=m.CustomTkPlayStoreAuditV93(); w.update_idletasks(); assert 'HiddenWindowPopen' in subprocess.Popen.__name__; assert not w.path_entry.winfo_ismapped(); assert w.choose_button.cget('text')=='Choose file'; assert w.scan_button.cget('text')=='Scan phone'; labels=[w._export_results_menu.entrycget(i,'label') for i in range(w._export_results_menu.index('end')+1) if w._export_results_menu.type(i)!='separator']; assert labels==['Export all results as CSV…','Export visible results as CSV…','Export all results as HTML…','Export visible results as HTML…'], labels; rows=[{'criticality':'🟢 Current','criticality_key':'green','criticality_rank':5,'package_name':'com.green','play_title':'Green','play_last_update':'Aug 1, 2026','age_days':14,'notes':'','change':'','play_status':'available','updated_source':'test','play_http_status':200,'app_name':'Green','store_url':'','is_system':False,'play_version':'1','installed_version':'1','version_comparison':'Match','installer_source':'Google Play','compatibility_status':'Modern','target_sdk':'35','min_sdk':'26','first_install_time':'2026-01-02 10:00:00','last_local_update':'2026-08-01 12:00:00','app_enabled':'Enabled','sensitive_permissions_count':'','sensitive_permissions':'','device_change':'Same','health_score':100},{'criticality':'🔴 Removed','criticality_key':'red','criticality_rank':0,'package_name':'com.red','play_title':'Red','play_last_update':'','age_days':'','notes':'','change':'','play_status':'not_found_in_checked_countries','updated_source':'','play_http_status':404,'app_name':'Red','store_url':'','is_system':False,'play_version':'','installed_version':'','version_comparison':'Different','installer_source':'','compatibility_status':'Unknown','target_sdk':'','min_sdk':'','first_install_time':'','last_local_update':'','app_enabled':'Enabled','sensitive_permissions_count':'','sensitive_permissions':'','device_change':'Same','health_score':40}]; w.current_rows=rows; w._last_inventory_changes={'had_previous':True,'counts':{'new':1,'removed':2,'version':1,'installer':0,'state':0}}; w._refresh_table(); assert '2/2 shown' in w.summary_var.get(); assert 'Version differences 1' in w.summary_var.get(); assert 'Device changes 4' in w.summary_var.get(); print('CustomTkinter v9.3 smoke test OK'); w.destroy()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-CustomTkinter `
            --icon app_icon.ico `
            --additional-hooks-dir=. `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            --collect-all customtkinter `
            --collect-all tkinterdnd2 `
            playstore_audit_customtkinter_v9_3_launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-CustomTkinter
          path: dist/PlayStoreAppAudit-CustomTkinter.exe
          if-no-files-found: error
          retention-days: 30
