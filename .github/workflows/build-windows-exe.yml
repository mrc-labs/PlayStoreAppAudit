name: Build Windows EXE - CustomTkinter

on:
  workflow_dispatch:
  push:
    branches: [customtkinter]
    paths:
      - "app_icon.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_gui.py"
      - "playstore_audit_windows.py"
      - "playstore_audit_customtkinter.py"
      - "playstore_audit_customtkinter_branch.py"
      - "playstore_audit_customtkinter_launcher.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit CustomTkinter.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and CustomTkinter UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_gui.py
          python -m py_compile playstore_audit_windows.py
          python -m py_compile playstore_audit_customtkinter.py
          python -m py_compile playstore_audit_customtkinter_branch.py
          python -m py_compile playstore_audit_customtkinter_launcher.py
          python -c "from app_icon import ensure_runtime_icon; p=ensure_runtime_icon(); assert p.exists(); print('Icon generation OK')"
          python -c "import playstore_audit_customtkinter_branch as m; w=m.CustomTkPlayStoreAuditBranch(); w.update_idletasks(); assert w.language_var.get()=='en'; assert int(w.workers_var.get())==16; assert tuple(w.tree['columns'])==w.COLUMNS; assert w.COLUMNS==('criticality','package_name','play_title','play_last_update','age_days','notes'); assert w.tree.heading('criticality','text')=='Status'; assert w.path_entry.cget('placeholder_text'); assert int(w.country_source_entry.grid_info()['row'])==1; assert int(w.skip_source_check.grid_info()['row'])==1; row={'play_status':'available_in_other_country'}; w._classify_criticality(row); assert row['criticality_key']=='blue'; row={'play_status':'not_found_in_checked_countries'}; w._classify_criticality(row); assert row['criticality_key']=='red'; w.current_rows=[{'app_name':'Test','package_name':'com.example.test','play_status':'available','play_last_update':'2026-08-01','age_days':14,'play_title':'Test','updated_source':'test','notes':'','criticality':'🟢 Current','criticality_key':'green','criticality_rank':5,'is_system':False,'store_url':''}]; w._refresh_table(); assert len(w.tree.get_children())==1; w._audit_active=True; w._audit_paused=False; w._audit_pause_event.set(); w._last_progress=(2,10,'x'); w._toggle_pause(); assert w._audit_paused and not w._audit_pause_event.is_set() and w.run_button.cget('text')=='Resume'; w._toggle_pause(); assert (not w._audit_paused) and w._audit_pause_event.is_set() and w.run_button.cget('text')=='Pause'; w._audit_active=False; w._set_run_mode('run'); assert w.run_button.cget('text')=='Run Play Store audit'; print('CustomTkinter columns/pause smoke test OK'); w.destroy()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-CustomTkinter `
            --icon app_icon.ico `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            --collect-all customtkinter `
            playstore_audit_customtkinter_launcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-CustomTkinter
          path: dist/PlayStoreAppAudit-CustomTkinter.exe
          if-no-files-found: error
          retention-days: 30
