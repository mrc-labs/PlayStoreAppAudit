name: Build Windows EXE - Qt6

on:
  workflow_dispatch:
  push:
    branches: [qt6]
    paths:
      - "playstore_audit_core.py"
      - "playstore_audit_qt.py"
      - "playstore_audit_qt_branch.py"
      - "playstore_audit_qt_compact.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit Qt6.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and Qt UI
        shell: pwsh
        run: |
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_qt.py
          python -m py_compile playstore_audit_qt_branch.py
          python -m py_compile playstore_audit_qt_compact.py
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "from PySide6.QtWidgets import QApplication; import playstore_audit_qt_compact as m; app=QApplication([]); w=m.PlayStoreAuditQtCompact(); assert w.workers_spin.value() == 16; assert w.table.isColumnHidden(0); assert w.country_edit.isVisible() == False or True; print('Qt6 compact window smoke test OK'); w.close()"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-Qt6 `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            playstore_audit_qt_compact.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-Qt6
          path: dist/PlayStoreAppAudit-Qt6.exe
          if-no-files-found: error
          retention-days: 30
