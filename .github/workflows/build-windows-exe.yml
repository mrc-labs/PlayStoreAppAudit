name: Build Windows EXE - Qt6

on:
  workflow_dispatch:
  push:
    branches: [qt6]
    paths:
      - "app_icon.py"
      - "playstore_audit_process.py"
      - "playstore_audit_core.py"
      - "playstore_audit_multicountry.py"
      - "playstore_audit_user_state.py"
      - "playstore_audit_v8_features.py"
      - "playstore_audit_v9_features.py"
      - "playstore_audit_v9_2_features.py"
      - "playstore_audit_v9_3_features.py"
      - "playstore_audit_qt.py"
      - "playstore_audit_qt_branch.py"
      - "playstore_audit_qt_compact.py"
      - "playstore_audit_qt_v8.py"
      - "playstore_audit_qt_v8_stable.py"
      - "playstore_audit_qt_v9.py"
      - "playstore_audit_qt_v9_fixed.py"
      - "playstore_audit_qt_v9_2.py"
      - "playstore_audit_qt_v9_2_stable.py"
      - "playstore_audit_qt_v9_3.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build PlayStoreAppAudit Qt6.exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Validate Python source and Qt6 v9.3 UI
        shell: pwsh
        run: |
          python -m py_compile app_icon.py
          python -m py_compile playstore_audit_process.py
          python -m py_compile playstore_audit_core.py
          python -m py_compile playstore_audit_multicountry.py
          python -m py_compile playstore_audit_user_state.py
          python -m py_compile playstore_audit_v8_features.py
          python -m py_compile playstore_audit_v9_features.py
          python -m py_compile playstore_audit_v9_2_features.py
          python -m py_compile playstore_audit_v9_3_features.py
          python -m py_compile playstore_audit_qt.py
          python -m py_compile playstore_audit_qt_branch.py
          python -m py_compile playstore_audit_qt_compact.py
          python -m py_compile playstore_audit_qt_v8.py
          python -m py_compile playstore_audit_qt_v8_stable.py
          python -m py_compile playstore_audit_qt_v9.py
          python -m py_compile playstore_audit_qt_v9_fixed.py
          python -m py_compile playstore_audit_qt_v9_2.py
          python -m py_compile playstore_audit_qt_v9_2_stable.py
          python -m py_compile playstore_audit_qt_v9_3.py
          $env:QT_QPA_PLATFORM="offscreen"
          python -c "import PySide6; v=tuple(int(x) for x in PySide6.__version__.split('.')[:2]); assert v >= (6,11), PySide6.__version__; import playstore_audit_v9_2_features as f; import playstore_audit_v9_3_features as f3; assert f.format_date_value('Aug 1, 2026','YYYY-MM-DD')=='2026-08-01'; assert 'Phone-only methods' in f.CSV_EXPORT_GUIDE; assert f3.device_change_count({'had_previous':True,'counts':{'new':1,'removed':2,'version':1,'installer':0,'state':0}})==4; print('Qt/PySide6', PySide6.__version__, 'and v9.3 helpers OK')"
          python -c "import subprocess; from PySide6.QtWidgets import QApplication; import playstore_audit_qt_v9_3 as m; app=QApplication([]); w=m.PlayStoreAuditQtV93(); assert 'HiddenWindowPopen' in subprocess.Popen.__name__; assert w.path_edit.isHidden(); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; exports=[a.text() for a in w._export_results_menu.actions() if a.text()]; assert exports==['Export all results as CSV…','Export visible results as CSV…','Export all results as HTML…','Export visible results as HTML…'], exports; file_labels=[a.text() for a in w.file_menu.actions() if a.text()]; [(_ for _ in ()).throw(AssertionError(x)) if x not in file_labels else None for x in exports]; rows=[{'criticality':'●  Current','criticality_key':'green','criticality_rank':5,'package_name':'com.green','play_title':'Green','play_last_update':'Aug 1, 2026','age_days':14,'notes':'','play_status':'available','updated_source':'test','play_http_status':200,'app_name':'Green','store_url':'','is_system':False,'play_version':'1','installed_version':'1','version_comparison':'Match','installer_source':'Google Play'},{'criticality':'●  Removed','criticality_key':'red','criticality_rank':0,'package_name':'com.red','play_title':'Red','play_last_update':'','age_days':'','notes':'','play_status':'not_found_in_checked_countries','updated_source':'','play_http_status':404,'app_name':'Red','store_url':'','is_system':False,'play_version':'','installed_version':'','version_comparison':'Different','installer_source':''}]; w.current_rows=rows; w.model.set_rows(rows); w.proxy.invalidateFilter(); w._last_inventory_changes={'had_previous':True,'counts':{'new':1,'removed':2,'version':1,'installer':0,'state':0}}; w._update_summary(); assert '2/2 shown' in w.summary_label.text(); assert 'Version differences 1' in w.summary_label.text(); assert 'Device changes 4' in w.summary_label.text(); print('Qt6 v9.3 smoke test OK'); w.close()"

      - name: Generate Windows icon
        shell: pwsh
        run: python -c "from app_icon import generate_windows_ico; print(generate_windows_ico('.'))"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name PlayStoreAppAudit-Qt6 `
            --icon app_icon.ico `
            --collect-all google_play_scraper `
            --collect-all bs4 `
            --collect-all lxml `
            playstore_audit_qt_v9_3.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PlayStoreAppAudit-Windows-Qt6
          path: dist/PlayStoreAppAudit-Qt6.exe
          if-no-files-found: error
          retention-days: 30
