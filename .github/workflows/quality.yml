name: Quality - Qt6

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and Qt smoke / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify runtime
        shell: pwsh
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -c "import os, sys, PySide6; expected=tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.'))); print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info[:2] == expected; assert tuple(map(int, PySide6.__version__.split('.')[:2])) >= (6,11)"

      - name: Compile, test and lint
        shell: pwsh
        run: |
          python -m compileall -q playstore_app_audit
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed.' }

          python -m py_compile .github/scripts/preflight_release_legal_material.py .github/scripts/sign_macos_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Release helper compilation failed.' }

          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed.' }

          ruff check playstore_app_audit tests main.py .github/scripts/preflight_release_legal_material.py .github/scripts/sign_macos_app.py
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed.' }

      - name: Qt offscreen smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); assert w.path_edit.isHidden(); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Device'); assert w.status_label.text()==old; assert w.country_edit.text(); print('Qt quality smoke test OK'); w.close()"
