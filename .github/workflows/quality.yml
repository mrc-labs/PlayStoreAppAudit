name: Quality - Qt6

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "scripts/*.ps1"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "scripts/*.ps1"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AGENTS.md"
      - ".github/workflows/*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and Qt smoke / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.14"
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify runtime
        shell: pwsh
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -c "import os, sys, PySide6; expected=tuple(map(int, os.environ['EXPECTED_PYTHON'].split('.'))); print(sys.version); print('PySide6', PySide6.__version__); assert sys.version_info[:2] == expected; assert PySide6.__version__ == '6.11.2'"

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/export_chat_handoff.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            throw 'PowerShell helper syntax validation failed.'
          }

      - name: Compile, test and lint
        shell: pwsh
        run: |
          python -m compileall -q playstore_app_audit
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed.' }

          python -m py_compile .github/scripts/capture_ui_style.py .github/scripts/preflight_release_legal_material.py .github/scripts/prepare_release_legal_bundle.py .github/scripts/sign_macos_app.py .github/scripts/assemble_windows_engineering_release.py .github/scripts/cleanup_actions_retention.py
          if ($LASTEXITCODE -ne 0) { throw 'Release/audit/maintenance helper compilation failed.' }

          python -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed.' }

          ruff check playstore_app_audit tests main.py .github/scripts/capture_ui_style.py .github/scripts/preflight_release_legal_material.py .github/scripts/prepare_release_legal_bundle.py .github/scripts/sign_macos_app.py .github/scripts/assemble_windows_engineering_release.py .github/scripts/cleanup_actions_retention.py
          if ($LASTEXITCODE -ne 0) { throw 'Ruff failed.' }

      - name: Qt offscreen smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); assert w.path_edit.isHidden(); assert w.choose_button.text()=='Choose File'; assert w.scan_button.text()=='Scan Phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Source Details'); assert w.status_label.text()==old; assert w.country_edit.text(); print('Qt quality smoke test OK'); w.close()"
