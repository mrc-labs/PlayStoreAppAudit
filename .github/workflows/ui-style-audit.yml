name: UI style audit

on:
  workflow_dispatch:
    inputs:
      windows_runtime_pilot:
        description: One native Windows x64 controlled source-stack diagnostic; never a final candidate
        type: boolean
        default: false
      trust_diagnostics_only:
        description: CA and selected target C++ SDK qualification only; no Python/Qt component rebuild
        type: boolean
        default: false
      runtime_pilot:
        description: One native Jammy x64 controlled Python-Qt-OpenSSL pilot; never a final candidate
        type: boolean
        default: false
      component_audit:
        description: Non-release six-target component/provider inventory; no UI capture or packaging
        type: boolean
        default: false
      expected_sha:
        description: Exact source SHA required for component diagnostics
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    if: ${{ !inputs.runtime_pilot && !inputs.windows_runtime_pilot }}
    name: ${{ inputs.component_audit && 'Components' || 'Styles' }} / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.component_audit && '[{"os":"windows-2025","label":"windows-x64","platform_key":"windows","arch":"x64"},{"os":"windows-11-arm","label":"windows-arm64","platform_key":"windows","arch":"arm64"},{"os":"ubuntu-24.04","label":"linux-x64","platform_key":"linux","arch":"x64"},{"os":"ubuntu-24.04-arm","label":"linux-arm64","platform_key":"linux","arch":"arm64"},{"os":"macos-26-intel","label":"macos-x64","platform_key":"macos","arch":"x64"},{"os":"macos-26","label":"macos-arm64","platform_key":"macos","arch":"arm64"}]' || '[{"os":"windows-2025","label":"Windows","platform_key":"windows","arch":"x64"},{"os":"macos-15","label":"macOS","platform_key":"macos","arch":"arm64"},{"os":"ubuntu-24.04","label":"Linux","platform_key":"linux","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}

    env:
      COMPONENT_AUDIT: ${{ inputs.component_audit }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify component diagnostic source SHA
        if: ${{ inputs.component_audit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${#EXPECTED_SHA}" = 40
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify stable Python 3.14
        shell: pwsh
        run: |
          python -c "import platform, sys; actual=platform.python_version(); print(actual); assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final', actual"
          if ($LASTEXITCODE -ne 0) { throw 'Stable Python 3.14 verification failed.' }

      - name: Install Linux display/runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            xauth \
            xvfb

      - name: Provision diagnostic Windows ARM64 cryptography
        if: ${{ inputs.component_audit && runner.os == 'Windows' && matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          & ./.github/scripts/provision_windows_arm64_openssl.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP "openssl-arm64-$env:GITHUB_RUN_ID")
          if ($LASTEXITCODE -ne 0) { throw 'Native crypto prerequisite failed.' }

      - name: Provision diagnostic Intel macOS cryptography
        if: ${{ inputs.component_audit && runner.os == 'macOS' && matrix.arch == 'x64' }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: bash .github/scripts/provision_macos_intel_crypto.sh

      - name: Select producing Linux x64 compatibility runtime for diagnostics
        if: ${{ inputs.component_audit && runner.os == 'Linux' && matrix.arch == 'x64' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/prepare_linux_x64_sysroot.sh

      - name: Install source-mode UI dependencies
        if: ${{ !(inputs.component_audit && runner.os == 'Windows' && matrix.arch == 'arm64') }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install -r requirements-dev.txt --report component-install.json
          if [ "$COMPONENT_AUDIT" = true ]; then
            python -m pip install "Nuitka==4.3.1"
            if [ "${{ runner.os }}" = Linux ]; then python -m pip install "patchelf==0.19.1.0"; fi
          fi

      - name: Install native Windows ARM64 diagnostic dependencies
        if: ${{ inputs.component_audit && runner.os == 'Windows' && matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          if ($LASTEXITCODE -ne 0) { throw 'Secure pip bootstrap failed.' }
          python -m pip install -r requirements-dev.txt --report component-install.json
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency installation failed.' }
          python -m pip install "Nuitka==4.3.1"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic compiler metadata installation failed.' }

      - name: Capture Windows native and Fusion styles
        if: ${{ !inputs.component_audit && runner.os == 'Windows' }}
        shell: pwsh
        env:
          QT_SCALE_FACTOR: "1"
        run: |
          python .github/scripts/capture_ui_style.py --style native --output-dir ui-style-audit
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows UI capture failed.' }
          python .github/scripts/capture_ui_style.py --style fusion --output-dir ui-style-audit
          if ($LASTEXITCODE -ne 0) { throw 'Fusion Windows UI capture failed.' }

      - name: Capture macOS native and Fusion styles
        if: ${{ !inputs.component_audit && runner.os == 'macOS' }}
        env:
          QT_SCALE_FACTOR: "1"
        run: |
          set -euo pipefail
          python .github/scripts/capture_ui_style.py --style native --output-dir ui-style-audit
          python .github/scripts/capture_ui_style.py --style fusion --output-dir ui-style-audit

      - name: Capture Linux default and Fusion styles under Xvfb
        if: ${{ !inputs.component_audit && runner.os == 'Linux' }}
        env:
          QT_SCALE_FACTOR: "1"
        run: |
          set -euo pipefail
          xvfb-run -a python .github/scripts/capture_ui_style.py --style native --output-dir ui-style-audit
          xvfb-run -a python .github/scripts/capture_ui_style.py --style fusion --output-dir ui-style-audit

      - name: Validate audit evidence
        if: ${{ !inputs.component_audit }}
        shell: bash
        env:
          PLATFORM_KEY: ${{ matrix.platform_key }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("ui-style-audit")
          native = json.loads((root / "metadata-native.json").read_text(encoding="utf-8"))
          fusion = json.loads((root / "metadata-fusion.json").read_text(encoding="utf-8"))
          platform_key = os.environ["PLATFORM_KEY"]

          native_style = str(native["active_style"]).casefold()
          fusion_style = str(fusion["active_style"]).casefold()
          if fusion_style != "fusion":
              raise RuntimeError(f"Fusion audit did not use Fusion: {fusion_style!r}")
          if platform_key in {"windows", "macos"} and native_style == "fusion":
              raise RuntimeError(
                  f"{platform_key} native/default audit unexpectedly resolved to Fusion; "
                  "the run would not test the requested native platform style"
              )

          expected = {
              "plain-native.png",
              "plain-fusion.png",
              "app-native.png",
              "app-fusion.png",
              "metadata-native.json",
              "metadata-fusion.json",
          }
          present = {path.name for path in root.iterdir() if path.is_file()}
          if present != expected:
              raise RuntimeError(f"Unexpected UI audit files: {sorted(present)}")

          def sha256(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          native_probe_hash = sha256(root / "plain-native.png")
          fusion_probe_hash = sha256(root / "plain-fusion.png")
          if platform_key in {"windows", "macos"} and native_probe_hash == fusion_probe_hash:
              raise RuntimeError(
                  f"{platform_key} native and Fusion plain-control captures are byte-identical"
              )

          summary = {
              "platform": platform_key,
              "native_active_style": native["active_style"],
              "fusion_active_style": fusion["active_style"],
              "native_platform_plugin": native["qt_platform_plugin"],
              "style_factory_keys": native["style_factory_keys"],
              "native_application_font": native["application_font_family"],
              "native_plain_sha256": native_probe_hash,
              "fusion_plain_sha256": fusion_probe_hash,
              "native_app_sha256": sha256(root / "app-native.png"),
              "fusion_app_sha256": sha256(root / "app-fusion.png"),
          }
          (root / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Upload UI audit screenshots and metadata
        if: ${{ !inputs.component_audit }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-style-audit-${{ matrix.platform_key }}
          path: ui-style-audit/
          if-no-files-found: error
          retention-days: 0

      - name: Inspect native component providers
        if: ${{ inputs.component_audit }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_runtime_components.py --output-dir component-audit

      - name: Verify ARM64 cryptography and probe CPython OpenSSL 4 feasibility
        if: ${{ inputs.component_audit && runner.os == 'Windows' && matrix.arch == 'arm64' }}
        shell: pwsh
        run: |
          Copy-Item component-install.json (Join-Path $env:CRYPTOGRAPHY_OPENSSL_EVIDENCE 'cryptography-install.json')
          python .github/scripts/verify_windows_arm64_crypto.py --evidence-dir $env:CRYPTOGRAPHY_OPENSSL_EVIDENCE
          if ($LASTEXITCODE -ne 0) { throw 'Native cryptography verification failed.' }
          python .github/scripts/probe_cpython_openssl4.py --output-dir component-audit/cpython-openssl4
          if ($LASTEXITCODE -ne 0) { throw 'Bounded CPython/OpenSSL API probe failed.' }
          Copy-Item -LiteralPath $env:CRYPTOGRAPHY_OPENSSL_EVIDENCE -Destination component-audit/openssl-cryptography -Recurse

      - name: Upload non-release component diagnostic evidence
        if: ${{ always() && inputs.component_audit }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-components-${{ matrix.platform_key }}-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            component-audit/
            component-install.json
            linux-diagnostics/
          if-no-files-found: error
          retention-days: 0

  runtime-pilot:
    if: ${{ inputs.runtime_pilot }}
    name: Native runtime-framework pilot / Linux x64 Jammy
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify isolated pilot source and native target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test '${{ inputs.component_audit }}' = false
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64

      - name: Diagnose system trust and C++ SDK before downloads or build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 .github/scripts/verify_native_runtime_pilot.py \
            --diagnose-system-trust --output-dir pilot-evidence

      - name: Qualify maintained target C++ link SDK before runtime downloads
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 .github/scripts/provision_pilot_cxx_sdk.py \
            --work-root "$RUNNER_TEMP/pilot-cxx-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence-dir pilot-evidence

      - name: Set up bootstrap Python
        if: ${{ !inputs.trust_diagnostics_only }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true

      - name: Verify stable Python 3.14
        if: ${{ !inputs.trust_diagnostics_only }}
        shell: bash
        run: |
          set -euo pipefail
          python -c "import platform, sys, sysconfig; print(platform.python_version()); assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final'; assert platform.machine() == 'x86_64' and not sysconfig.get_config_var('Py_GIL_DISABLED')"

      - name: Install ephemeral native build prerequisites
        if: ${{ !inputs.trust_diagnostics_only }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patch \
            libbz2-dev libffi-dev liblzma-dev libreadline-dev libsqlite3-dev \
            libzstd-dev zlib1g-dev libgdbm-dev libncurses-dev uuid-dev \
            libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev \
            libdbus-1-dev libx11-dev libx11-xcb-dev libxext-dev libxrender-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-sync-dev libxcb-util-dev libxcb-xfixes0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-x11-dev xvfb xauth
          python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
          python -m pip install 'cmake==4.4.4' 'ninja==1.13.2'

      - name: Build and exercise one controlled native stack
        if: ${{ !inputs.trust_diagnostics_only }}
        shell: bash
        run: |
          set -euo pipefail
          test -d pilot-evidence
          bash .github/scripts/build_native_runtime_pilot.sh \
            "$RUNNER_TEMP/native-runtime-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee pilot-evidence/pilot-build.log

      - name: Upload diagnostic runtime-framework evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-runtime-framework-linux-x64-${{ github.run_id }}
          path: pilot-evidence/
          if-no-files-found: error
          retention-days: 0

  windows-runtime-pilot:
    if: ${{ inputs.windows_runtime_pilot }}
    name: Native runtime-framework pilot / Windows x64
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify isolated Windows pilot SHA and target
        shell: pwsh
        run: |
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Exact SHA required.' }
          if ($env:EXPECTED_SHA -ne '${{ github.sha }}') { throw 'Dispatch SHA mismatch.' }
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Checkout SHA mismatch.' }
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Native x64 runner required.' }
          if ('${{ inputs.runtime_pilot }}' -ne 'false' -or '${{ inputs.component_audit }}' -ne 'false' -or '${{ inputs.trust_diagnostics_only }}' -ne 'false') { throw 'Select only Windows x64 pilot.' }

      - name: Set up Windows pilot bootstrap Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          check-latest: true
          architecture: x64

      - name: Verify stable Python 3.14
        shell: pwsh
        run: |
          python -c "import platform, sys, sysconfig; print(platform.python_version()); assert sys.version_info[:2] == (3, 14) and sys.version_info.releaselevel == 'final'; assert platform.machine().upper() == 'AMD64' and not sysconfig.get_config_var('Py_GIL_DISABLED')"
          if ($LASTEXITCODE -ne 0) { throw 'Stable native bootstrap required.' }

      - name: Qualify and exercise controlled Windows stack
        shell: pwsh
        run: |
          & ./.github/scripts/build_windows_runtime_pilot.ps1 -WorkRoot (Join-Path $env:RUNNER_TEMP "windows-runtime-pilot-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT")
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows pilot failed.' }

      - name: Upload diagnostic Windows runtime evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-runtime-framework-windows-x64-${{ github.run_id }}
          path: windows-pilot-evidence/
          if-no-files-found: error
          retention-days: 0
