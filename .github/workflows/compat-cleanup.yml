name: One-time compatibility alias cleanup

on:
  push:
    branches: ["refactor/v0.12-compat-cleanup"]
    paths:
      - "tools/cleanup_compat_aliases.py"
      - "tools/cleanup_compat_aliases_patch.py"
      - ".github/workflows/compat-cleanup.yml"

permissions:
  contents: write

jobs:
  migrate-test-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/v0.12-compat-cleanup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Apply cleanup
        shell: pwsh
        run: |
          python tools/cleanup_compat_aliases.py
          python tools/cleanup_compat_aliases_patch.py

      - name: Format, test, lint and smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ruff format playstore_app_audit tests main.py
          ruff check --fix playstore_app_audit tests main.py
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py
          python -c "from PySide6.QtWidgets import QApplication; from playstore_app_audit.ui.main_window import MainWindow; app=QApplication([]); w=MainWindow(); assert w.choose_button.text()=='Choose file'; assert w.scan_button.text()=='Scan phone'; old='Audit completed • 10 cached • 2 live'; w.status_label.setText(old); w._set_view_preset('Device'); assert w.status_label.text()==old; print('Compatibility cleanup Qt smoke OK'); w.close()"

      - name: Remove one-time migration machinery
        shell: pwsh
        run: |
          Remove-Item tools/cleanup_compat_aliases.py
          Remove-Item tools/cleanup_compat_aliases_patch.py
          Remove-Item .github/workflows/compat-cleanup.yml
          if (Test-Path tools -PathType Container) {
            if (-not (Get-ChildItem tools -Force | Select-Object -First 1)) { Remove-Item tools }
          }

      - name: Commit validated cleanup
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Remove persistence shim and historical module aliases"
          git push origin HEAD:refactor/v0.12-compat-cleanup
