name: Diagnose native ADB Linux ARM64

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact diagnostic source SHA; not a release candidate
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-adb:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Guard native diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = '${{ inputs.expected_sha }}'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = aarch64
          test "$(. /etc/os-release; echo "$VERSION_ID")" = 24.04
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true
      - name: Qualify stable native tool prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -c "import platform,sys,sysconfig; assert platform.machine() == 'aarch64' and sys.version_info[:2] == (3,14) and sys.version_info.releaselevel == 'final' and not sysconfig.get_config_var('Py_GIL_DISABLED')"
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 pkg-config libgtest-dev libusb-1.0-0-dev libpcre2-dev libprotobuf-dev protobuf-compiler libbrotli-dev libzstd-dev liblz4-dev zlib1g-dev
          python .github/scripts/bootstrap_pip.py
          python -m pip install 'cmake==4.4.4' 'ninja==1.13.2'
          rustup toolchain install 1.99.1 --profile minimal
      - name: Build only native adb and exercise isolated read-only consumers
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/probe_adb_linux_arm64.py --work "$RUNNER_TEMP/adb-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --output adb-diagnostic-evidence
      - name: Retain diagnostic sources legal native bytes and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostic-adb-linux-arm64-${{ github.run_id }}
          path: adb-diagnostic-evidence
          if-no-files-found: warn
          retention-days: 30
