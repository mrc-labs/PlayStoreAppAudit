name: Apply v1.7 release closure docs

on:
  pull_request:
    paths:
      - ".github/workflows/apply-v17-release-closure.yml"
      - ".github/scripts/apply_v17_release_closure.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-closure branch
        uses: actions/checkout@v7
        with:
          ref: docs/v1.7-release-closure
          fetch-depth: 0

      - name: Apply and validate documentation closure
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/apply_v17_release_closure.py
          python -m py_compile .github/scripts/apply_v17_release_closure.py
          git diff --check
          test -f docs/HANDOFF_V1.8.md
          grep -Fq 'Latest published version: `v1.7.0`' docs/PROJECT_STATUS.md
          grep -Fq 'v1.8 and v1.9 releases are Windows x64 only' docs/HANDOFF_V1.8.md
          grep -Fq 'Play Store App Audit v1.7.0 (Win x64 Only)' README.md
          grep -Fq '## [1.7.0] - 2026-08-23' CHANGELOG.md

      - name: Remove temporary closure helpers and push docs branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/scripts/apply_v17_release_closure.py .github/workflows/apply-v17-release-closure.yml
          git config user.name "mrc-labs"
          git config user.email "164878571+mrc-labs@users.noreply.github.com"
          git add AGENTS.md README.md CHANGELOG.md docs
          git diff --cached --check
          git commit -m "docs: close v1.7 and hand off v1.8"
          git push origin HEAD:docs/v1.7-release-closure
