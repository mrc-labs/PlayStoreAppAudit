name: Build macOS / Linux - Qt6 (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Desktop target to build"
        required: true
        default: "both"
        type: choice
        options:
          - linux
          - macos
          - both
      expected_sha:
        description: Exact commit SHA expected for this deliberate build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    if: ${{ inputs.target == 'linux' || inputs.target == 'both' }}
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            expected_elf_machine: Advanced Micro Devices X86-64
            managed_adb: true
          - os: ubuntu-24.04-arm
            arch: arm64
            expected_elf_machine: AArch64
            managed_adb: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify requested build commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          dispatch="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

          if [[ "$dispatch" != "$expected" ]]; then
            echo "The dispatched ref resolved to $dispatch, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          if [[ "$actual" != "$expected" ]]; then
            echo "Checkout produced $actual, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          echo "Release-candidate source SHA verified: $actual"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Read canonical project version
        id: project_version
        run: |
          VERSION="$(python -c 'from playstore_app_audit import __version__; print(__version__)')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install Linux runtime and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libx11-xcb1 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-util1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            unzip \
            xauth \
            xvfb \
            zip
          if [ "${{ matrix.managed_adb }}" != "true" ]; then sudo apt-get install -y adb; fi
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "Nuitka==4.1.3"
      - name: Test shared source and Qt event loop
        env:
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py
          python main.py
      - name: Validate ADB path for this architecture
        run: |
          python - <<'PY'
          import subprocess
          from playstore_app_audit.devices.adb import find_adb, install_platform_tools
          from playstore_app_audit.platform.runtime import managed_platform_tools_download_supported, machine_key
          expected = '${{ matrix.arch }}'
          assert machine_key() == expected
          if managed_platform_tools_download_supported():
              adb, version = install_platform_tools(); print(version)
          else:
              adb = find_adb(); assert adb, 'native ADB is required and was not found'
          result = subprocess.run([adb, 'version'], capture_output=True, text=True, timeout=20)
          print(result.stdout)
          assert result.returncode == 0 and 'Android Debug Bridge' in result.stdout
          PY
      - name: Generate Linux icon
        run: python -c "from app_icon import generate_app_icon; print(generate_app_icon('app_icon.png', 256))"
      - name: Configure Qt deployment
        run: |
          pyside6-deploy main.py --name PlayStoreAppAudit --init
          python - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path
          p=ConfigParser(); p.read('pysidedeploy.spec')
          p['app']['exec_directory']=str(Path('dist').resolve())
          p['app']['icon']=str(Path('app_icon.png').resolve())
          p['nuitka']['mode']='standalone'
          p['nuitka']['extra_args']='--quiet --noinclude-qt-translations --noinclude-qt-plugins=platforminputcontexts --nofollow-import-to=PIL --assume-yes-for-downloads --report=compilation-report.xml'
          with open('pysidedeploy.spec','w',encoding='utf-8') as f: p.write(f)
          PY
      - name: Build, inspect and smoke packaged Linux standalone tree
        env:
          APP_VERSION: ${{ steps.project_version.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          set -euo pipefail

          mkdir -p dist artifact package roundtrip
          pyside6-deploy -c pysidedeploy.spec -f
          test -s compilation-report.xml

          STANDALONE_DIR="$(find dist -maxdepth 1 -type d -name '*.dist' -print -quit)"
          test -n "$STANDALONE_DIR"

          find "$STANDALONE_DIR" -type f -name 'libqpdf.so*' -print -delete

          if find "$STANDALONE_DIR" -type f -name 'libqpdf.so*' -print -quit | grep -q .; then
            echo "Qt PDF image plugin pruning failed." >&2
            exit 1
          fi

          if find "$STANDALONE_DIR" -path '*platforminputcontexts*' -print -quit | grep -q .; then
            echo "Qt Virtual Keyboard runtime exclusion failed." >&2
            exit 1
          fi

          BIN="$(find "$STANDALONE_DIR" -maxdepth 1 -type f \
            \( -name 'PlayStoreAppAudit' \
            -o -name 'PlayStoreAppAudit.bin' \
            -o -name 'main' \
            -o -name 'main.bin' \) -print -quit)"

          test -n "$BIN"
          test "$(stat -c%s "$BIN")" -gt 1048576
          chmod +x "$BIN"

          file "$BIN"

          ELF_MACHINE="$(readelf -h "$BIN" |
            awk -F: '/Machine:/{sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          echo "ELF machine architecture: $ELF_MACHINE"
          test "$ELF_MACHINE" = "${{ matrix.expected_elf_machine }}"
          export PACKAGE_ELF_MACHINE="$ELF_MACHINE"

          "$BIN"

          PACKAGE_NAME="PlayStoreAppAudit-v${APP_VERSION}-linux-${PACKAGE_ARCH}"
          PACKAGE_DIR="package/$PACKAGE_NAME"

          mkdir -p "$PACKAGE_DIR"
          cp -a "$STANDALONE_DIR/." "$PACKAGE_DIR/"

          SOURCE_BIN_NAME="$(basename "$BIN")"
          PACKAGE_BIN="$PACKAGE_DIR/PlayStoreAppAudit"

          if [ "$SOURCE_BIN_NAME" != "PlayStoreAppAudit" ]; then
            mv "$PACKAGE_DIR/$SOURCE_BIN_NAME" "$PACKAGE_BIN"
          fi

          chmod +x "$PACKAGE_BIN"
          test -x "$PACKAGE_BIN"

          QT_CORE="$(find "$PACKAGE_DIR" -type f             -name 'libQt6Core.so*' -print -quit)"
          PYSIDE_LIB="$(find "$PACKAGE_DIR" -type f             -name 'libpyside6*.so*' -print -quit)"
          SHIBOKEN_LIB="$(find "$PACKAGE_DIR" -type f             -name 'libshiboken6*.so*' -print -quit)"

          test -n "$QT_CORE"
          test -n "$PYSIDE_LIB"
          test -n "$SHIBOKEN_LIB"

          echo "Qt Core shared library: $QT_CORE"
          echo "PySide6 shared library: $PYSIDE_LIB"
          echo "Shiboken6 shared library: $SHIBOKEN_LIB"

          python - <<'PY' > "$PACKAGE_DIR/BUILD-INFO.txt"
          import os
          import platform
          import sys
          from importlib.metadata import version

          import PySide6

          print('Application version:', os.environ['APP_VERSION'])
          print('GitHub SHA:', os.environ.get('GITHUB_SHA', 'unavailable'))
          print('GitHub ref:', os.environ.get('GITHUB_REF', 'unavailable'))
          print('GitHub ref name:', os.environ.get('GITHUB_REF_NAME', 'unavailable'))
          print('Runner OS:', os.environ.get('RUNNER_OS', 'unavailable'))
          print('Runner image OS:', os.environ.get('ImageOS', 'unavailable'))
          print('Runner image version:', os.environ.get('ImageVersion', 'unavailable'))
          print(
              'Build/test host OS:',
              platform.freedesktop_os_release().get(
                  'PRETTY_NAME',
                  platform.platform(),
              ),
          )
          print('Build/test host kernel:', platform.platform())
          print('Package architecture:', os.environ['PACKAGE_ARCH'])
          print(
              'ELF machine architecture:',
              os.environ['PACKAGE_ELF_MACHINE'],
          )
          print('Build host architecture:', platform.machine())
          print('Python:', sys.version.replace('\n', ' '))
          print('PySide6:', PySide6.__version__)
          print('Nuitka:', version('Nuitka'))
          PY

          LEGAL_RELEASE_DIR="$PWD/artifact/legal-release-v${APP_VERSION}"

          python .github/scripts/prepare_release_legal_bundle.py \
            --package-dir "$PACKAGE_DIR" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --repo-root "$PWD" \
            --release-tag "v${APP_VERSION}" \
            --nuitka-report "$PWD/compilation-report.xml" \
            --inject

          python .github/scripts/validate_release_legal_bundle.py \
            --package-dir "$PACKAGE_DIR" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --public

          SOURCE_SUMS="$LEGAL_RELEASE_DIR/source-assets/SHA256SUMS.txt"
          SOURCE_BUNDLE="$LEGAL_RELEASE_DIR/PlayStoreAppAudit-v${APP_VERSION}-third-party-sources.tar.xz"

          test -s "$SOURCE_SUMS"
          test -s "$SOURCE_BUNDLE"

          test -f "$PACKAGE_DIR/LICENSE"
          test -f "$PACKAGE_DIR/THIRD_PARTY_NOTICES.md"
          test -f "$PACKAGE_DIR/SOURCE-AVAILABILITY.md"
          test -d "$PACKAGE_DIR/licenses"

          test ! -e "$PACKAGE_DIR/LEGAL-MANIFEST.json"
          test ! -e "$PACKAGE_DIR/validation-evidence"

          ARCHIVE="$PWD/artifact/$PACKAGE_NAME.zip"

          (
            cd package
            zip -qr "$ARCHIVE" "$PACKAGE_NAME"
          )

          test "$(stat -c%s "$ARCHIVE")" -gt 1048576

          unzip -q "$ARCHIVE" -d roundtrip

          ROUNDTRIP_DIR="roundtrip/$PACKAGE_NAME"
          ROUNDTRIP_BIN="$ROUNDTRIP_DIR/PlayStoreAppAudit"

          test -x "$ROUNDTRIP_BIN"
          test -f "$ROUNDTRIP_DIR/BUILD-INFO.txt"

          test -f "$ROUNDTRIP_DIR/LICENSE"
          test -f "$ROUNDTRIP_DIR/THIRD_PARTY_NOTICES.md"
          test -f "$ROUNDTRIP_DIR/SOURCE-AVAILABILITY.md"
          test -d "$ROUNDTRIP_DIR/licenses"

          test ! -e "$ROUNDTRIP_DIR/LEGAL-MANIFEST.json"
          test ! -e "$ROUNDTRIP_DIR/validation-evidence"

          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libQt6Core.so*' -print -quit)"
          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libpyside6*.so*' -print -quit)"
          test -n "$(find "$ROUNDTRIP_DIR" -type f             -name 'libshiboken6*.so*' -print -quit)"

          ROUNDTRIP_MACHINE="$(readelf -h "$ROUNDTRIP_BIN" |
            awk -F: '/Machine:/{sub(/^[[:space:]]+/, "", $2); print $2; exit}')"

          test "$ROUNDTRIP_MACHINE" = "${{ matrix.expected_elf_machine }}"

          timeout 30s xvfb-run -a             env QT_QPA_PLATFORM=xcb "$ROUNDTRIP_BIN"

          sha256sum "$ARCHIVE"
          ls -lh artifact/*

      - uses: actions/upload-artifact@v7
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-linux-${{ matrix.arch }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30

  build-macos:
    if: ${{ inputs.target == 'macos' || inputs.target == 'both' }}
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            expected_macho_arch: arm64
          - os: macos-15-intel
            arch: x64
            expected_macho_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify requested build commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          expected="$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')"
          dispatch="$(printf '%s' "$DISPATCH_SHA" | tr '[:upper:]' '[:lower:]')"
          actual="$(git rev-parse HEAD | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$expected" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

          if [[ "$dispatch" != "$expected" ]]; then
            echo "The dispatched ref resolved to $dispatch, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          if [[ "$actual" != "$expected" ]]; then
            echo "Checkout produced $actual, but expected_sha is $expected. STOP before expensive build work." >&2
            exit 1
          fi

          echo "Release-candidate source SHA verified: $actual"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Read canonical project version
        id: project_version
        run: |
          VERSION="$(python -c 'from playstore_app_audit import __version__; print(__version__)')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "Nuitka==4.1.3"
      - name: Test shared source and Qt event loop
        env:
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          python -m compileall -q playstore_app_audit
          python -m pytest
          ruff check playstore_app_audit tests main.py
          python main.py
      - name: Validate managed ADB
        run: |
          python - <<'PY'
          import subprocess
          from playstore_app_audit.devices.adb import install_platform_tools
          from playstore_app_audit.platform.runtime import machine_key
          assert machine_key() == '${{ matrix.arch }}'
          adb, version = install_platform_tools(); print(version)
          result = subprocess.run([adb, 'version'], capture_output=True, text=True, timeout=20)
          print(result.stdout)
          assert result.returncode == 0 and 'Android Debug Bridge' in result.stdout
          PY
      - name: Generate macOS icon
        run: |
          mkdir -p app_icon.iconset
          python - <<'PY'
          from app_icon import generate_app_icon
          for size in (16, 32, 128, 256, 512):
              generate_app_icon(f'app_icon.iconset/icon_{size}x{size}.png', size)
              generate_app_icon(f'app_icon.iconset/icon_{size}x{size}@2x.png', size*2)
          PY
          iconutil -c icns app_icon.iconset -o app_icon.icns
      - name: Configure Qt deployment
        env:
          APP_VERSION: ${{ steps.project_version.outputs.version }}
        run: |
          pyside6-deploy main.py --name PlayStoreAppAudit --init
          python - <<'PY'
          from configparser import ConfigParser
          import os
          from pathlib import Path
          p=ConfigParser(); p.read('pysidedeploy.spec')
          p['app']['exec_directory']=str(Path('dist').resolve())
          p['app']['icon']=str(Path('app_icon.icns').resolve())
          p['nuitka']['mode']='standalone'
          version = os.environ['APP_VERSION']
          p['nuitka']['extra_args']=f'--quiet --noinclude-qt-translations --noinclude-qt-plugins=platforminputcontexts --macos-app-name=PlayStoreAppAudit --macos-app-version={version} --macos-signed-app-name=com.mrclabs.PlayStoreAppAudit --nofollow-import-to=PIL --assume-yes-for-downloads --report=compilation-report.xml'
          with open('pysidedeploy.spec','w',encoding='utf-8') as f: p.write(f)
          PY
      - name: Build, inspect and smoke packaged macOS app
        env:
          APP_VERSION: ${{ steps.project_version.outputs.version }}
          PACKAGE_ARCH: ${{ matrix.arch }}
          QT_QPA_PLATFORM: offscreen
          PLAYSTORE_APP_AUDIT_SMOKE_TEST: "1"
        run: |
          mkdir -p dist artifact roundtrip
          pyside6-deploy -c pysidedeploy.spec -f
          test -s compilation-report.xml
          APP=$(find dist -maxdepth 2 -type d -name '*.app' | head -n 1)
          test -n "$APP"

          find "$APP" -type f -name 'libqpdf*.dylib' -print -delete

          if find "$APP" -type f -name 'libqpdf*.dylib' -print -quit | grep -q .; then
            echo "Qt PDF image plugin pruning failed." >&2
            exit 1
          fi

          test "$(du -sk "$APP" | awk '{print $1}')" -gt 1024
          PLIST="$APP/Contents/Info.plist"
          plutil -lint "$PLIST"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          test -n "$EXECUTABLE_NAME"
          EXEC="$APP/Contents/MacOS/$EXECUTABLE_NAME"
          test -f "$EXEC"
          test -x "$EXEC"
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleVersion' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $APP_VERSION" "$PLIST"
          plutil -lint "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$PLIST")" = "PlayStoreAppAudit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.mrclabs.PlayStoreAppAudit"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$APP_VERSION"
          file "$EXEC"
          MACHO_ARCHES="$(lipo -archs "$EXEC")"
          echo "Mach-O architecture: $MACHO_ARCHES"
          test "$MACHO_ARCHES" = "${{ matrix.expected_macho_arch }}"
          BUILD_INFO=$(xcrun vtool -show-build "$EXEC"); echo "$BUILD_INFO"
          MINOS=$(printf '%s\n' "$BUILD_INFO" | awk '$1 == "minos" { print $2; exit }')
          MINOS_METADATA="LC_BUILD_VERSION/minos"
          if [ -z "$MINOS" ]; then
            MINOS=$(printf '%s\n' "$BUILD_INFO" | awk '
              $1 == "cmd" { legacy = ($2 == "LC_VERSION_MIN_MACOSX"); next }
              legacy && $1 == "version" { print $2; exit }
            ')
            MINOS_METADATA="LC_VERSION_MIN_MACOSX/version"
          fi
          test -n "$MINOS"
          if find "$APP" -path '*platforminputcontexts*' -print | grep -q .; then exit 1; fi
          BUNDLE_BUILD_INFO="$APP/Contents/Resources/BUILD-INFO.txt"
          mkdir -p "$(dirname "$BUNDLE_BUILD_INFO")"
          PACKAGE_MINIMUM_MACOS="$MINOS" PACKAGE_MINIMUM_MACOS_METADATA="$MINOS_METADATA" PACKAGE_MACHO_ARCHES="$MACHO_ARCHES" python - <<'PY' > "$BUNDLE_BUILD_INFO"
          import os
          import platform
          import sys
          from importlib.metadata import version

          import PySide6

          print('Application version:', os.environ['APP_VERSION'])
          print('GitHub SHA:', os.environ.get('GITHUB_SHA', 'unavailable'))
          print('GitHub ref:', os.environ.get('GITHUB_REF', 'unavailable'))
          print('GitHub ref name:', os.environ.get('GITHUB_REF_NAME', 'unavailable'))
          print('Runner OS:', os.environ.get('RUNNER_OS', 'unavailable'))
          print('Runner image OS:', os.environ.get('ImageOS', 'unavailable'))
          print('Runner image version:', os.environ.get('ImageVersion', 'unavailable'))
          print('Build/test host OS:', platform.platform())
          print('Build host macOS version:', platform.mac_ver()[0])
          print('Package architecture:', os.environ['PACKAGE_ARCH'])
          print('Mach-O executable architecture:', os.environ['PACKAGE_MACHO_ARCHES'])
          print('Main executable minimum-version metadata:', os.environ['PACKAGE_MINIMUM_MACOS_METADATA'])
          print('Main executable reported minimum macOS version:', os.environ['PACKAGE_MINIMUM_MACOS'])
          print('Python:', sys.version.replace('\n', ' '))
          print('PySide6:', PySide6.__version__)
          print('Nuitka:', version('Nuitka'))
          print('Signing: ad-hoc CI signature only; not Apple-notarized')
          PY

          LEGAL_RELEASE_DIR="$PWD/artifact/legal-release-v${APP_VERSION}"

          python .github/scripts/prepare_release_legal_bundle.py \
            --package-dir "$APP" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --repo-root "$PWD" \
            --release-tag "v${APP_VERSION}" \
            --nuitka-report "$PWD/compilation-report.xml" \
            --inject

          test -f "$APP/Contents/Resources/LICENSE"
          test -f "$APP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$APP/Contents/Resources/SOURCE-AVAILABILITY.md"
          test -d "$APP/Contents/Resources/licenses"

          test ! -e "$APP/Contents/Resources/LEGAL-MANIFEST.json"
          test ! -e "$APP/Contents/Resources/validation-evidence"

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          "$EXEC"

          python .github/scripts/prepare_release_legal_bundle.py \
            --package-dir "$APP" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --refresh-runtime-evidence

          python .github/scripts/validate_release_legal_bundle.py \
            --package-dir "$APP" \
            --release-dir "$LEGAL_RELEASE_DIR" \
            --public

          SOURCE_SUMS="$LEGAL_RELEASE_DIR/source-assets/SHA256SUMS.txt"
          SOURCE_BUNDLE="$LEGAL_RELEASE_DIR/PlayStoreAppAudit-v${APP_VERSION}-third-party-sources.tar.xz"

          test -s "$SOURCE_SUMS"
          test -s "$SOURCE_BUNDLE"

          ZIP="artifact/PlayStoreAppAudit-v${APP_VERSION}-macos-${PACKAGE_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          test "$(stat -f%z "$ZIP")" -gt 1048576
          ditto -x -k "$ZIP" roundtrip
          RAPP=$(find roundtrip -maxdepth 2 -type d -name '*.app' | head -n 1)
          test -n "$RAPP"
          test -f "$RAPP/Contents/Resources/BUILD-INFO.txt"

          test -f "$RAPP/Contents/Resources/LICENSE"
          test -f "$RAPP/Contents/Resources/THIRD_PARTY_NOTICES.md"
          test -f "$RAPP/Contents/Resources/SOURCE-AVAILABILITY.md"
          test -d "$RAPP/Contents/Resources/licenses"

          test ! -e "$RAPP/Contents/Resources/LEGAL-MANIFEST.json"
          test ! -e "$RAPP/Contents/Resources/validation-evidence"
          cmp "$BUNDLE_BUILD_INFO" "$RAPP/Contents/Resources/BUILD-INFO.txt"
          RPLIST="$RAPP/Contents/Info.plist"
          plutil -lint "$RPLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RPLIST")" = "$APP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RPLIST")" = "$APP_VERSION"
          REXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$RPLIST")"
          test -n "$REXECUTABLE_NAME"
          REXEC="$RAPP/Contents/MacOS/$REXECUTABLE_NAME"
          test -f "$REXEC"
          test -x "$REXEC"
          ROUNDTRIP_ARCHES="$(lipo -archs "$REXEC")"
          test "$ROUNDTRIP_ARCHES" = "${{ matrix.expected_macho_arch }}"
          codesign --verify --deep --strict --verbose=2 "$RAPP"
          "$REXEC"
          shasum -a 256 "$ZIP"
          ls -lh artifact/*
      - uses: actions/upload-artifact@v7
        with:
          name: PlayStoreAppAudit-v${{ steps.project_version.outputs.version }}-macos-${{ matrix.arch }}
