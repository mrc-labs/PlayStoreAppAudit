[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-app-audit"
version = "1.99.0"
license = "GPL-3.0-only"
description = "Desktop utility for auditing Android package IDs against public Google Play listings."
readme = "README.md"
requires-python = ">=3.14"
authors = [{name = "MRC"}]
keywords = ["android", "google-play", "adb", "pyside6", "qt6", "desktop-app"]
dependencies = [
    "pyaxmlparser==0.3.31",
    "google-play-scraper==1.2.7",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.1",
    "PySide6-Essentials==6.11.2",
]

[project.urls]
Repository = "https://github.com/mrc-labs/PlayStoreAppAudit"
Releases = "https://github.com/mrc-labs/PlayStoreAppAudit/releases"
Documentation = "https://github.com/mrc-labs/PlayStoreAppAudit/tree/main/docs"

[project.scripts]
playstore-app-audit = "playstore_app_audit.app:main"

[tool.setuptools.packages.find]
include = ["playstore_app_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"playstore_app_audit/services/audit_engine.py" = ["SIM113"]
"playstore_app_audit/services/device_metadata.py" = ["SIM105"]
"playstore_app_audit/services/summary.py" = ["SIM105"]
"playstore_app_audit/ui/base_window.py" = ["B008", "SIM102"]
"playstore_app_audit/ui/preferences_window.py" = ["E402"]
"playstore_app_audit/ui/results_window.py" = ["SIM105"]
"playstore_app_audit/ui/table_window.py" = ["E402", "B008", "SIM102"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
