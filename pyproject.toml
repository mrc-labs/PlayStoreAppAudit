[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-app-audit"
version = "0.11.0"
description = "Qt desktop utility for auditing Android packages against public Google Play listings."
requires-python = ">=3.13"
authors = [{name = "MRC"}]
dependencies = [
    "google-play-scraper>=1.2.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PySide6-Essentials>=6.11",
]

[project.scripts]
playstore-app-audit = "playstore_app_audit.app:main"

[tool.setuptools.packages.find]
include = ["playstore_app_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "B008", "SIM102", "SIM105", "SIM113"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "^(playstore_app_audit.ui.base_window_v.*|playstore_audit_customtkinter.*)\\.py$"
