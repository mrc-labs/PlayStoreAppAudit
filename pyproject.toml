[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playstore-app-audit"
version = "0.10.0"
description = "Qt desktop utility for auditing Android packages against public Google Play listings."
requires-python = ">=3.14"
authors = [{name = "MRC"}]
dependencies = [
    "google-play-scraper>=1.2.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "PySide6-Essentials>=6.11",
    "Pillow>=10.0",
]

[project.scripts]
playstore-app-audit = "playstore_app_audit.app:main"

[tool.setuptools.packages.find]
include = ["playstore_app_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 110
exclude = [
    "playstore_audit_qt_v*.py",
    "playstore_audit_customtkinter*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "^(playstore_audit_qt_v.*|playstore_audit_customtkinter.*)\\.py$"
