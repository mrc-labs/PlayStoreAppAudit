<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
<defs>
  <linearGradient id="phoneFrame" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b65d9"/>
    <stop offset=".45" stop-color="#45c8ff"/>
    <stop offset="1" stop-color="#0060e8"/>
  </linearGradient>
  <linearGradient id="phoneScreen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0877f2"/>
    <stop offset=".5" stop-color="#0554c7"/>
    <stop offset="1" stop-color="#073a9f"/>
  </linearGradient>
  <linearGradient id="android" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#b5ff31"/>
    <stop offset=".5" stop-color="#6be21d"/>
    <stop offset="1" stop-color="#19b83a"/>
  </linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#21a9ff"/>
    <stop offset=".55" stop-color="#0869e9"/>
    <stop offset="1" stop-color="#0349bd"/>
  </linearGradient>
  <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#20c5ff"/>
    <stop offset=".55" stop-color="#0875ef"/>
    <stop offset="1" stop-color="#0646c9"/>
  </linearGradient>
  <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff23a"/>
    <stop offset="1" stop-color="#ffb52a"/>
  </linearGradient>
  <linearGradient id="boxLeft" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff8c22"/>
    <stop offset="1" stop-color="#ff3d35"/>
  </linearGradient>
  <linearGradient id="boxRight" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1ec4ff"/>
    <stop offset="1" stop-color="#0a7ae8"/>
  </linearGradient>
  <linearGradient id="tape" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9bff35"/>
    <stop offset="1" stop-color="#16be46"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#062b6d" flood-opacity=".28"/>
  </filter>
</defs>

<!-- Android mascot, peeking behind phone -->
<g transform="rotate(-11 52 147)" filter="url(#shadow)">
  <line x1="40" y1="94" x2="32" y2="80" stroke="#72e31d" stroke-width="6" stroke-linecap="round"/>
  <line x1="63" y1="91" x2="68" y2="75" stroke="#72e31d" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 132 C22 108 35 94 52 94 C69 94 82 108 82 132 Z" fill="url(#android)"/>
  <path d="M22 133 H82 V179 C82 194 70 204 53 204 C36 204 22 194 22 179 Z" fill="url(#android)"/>
  <rect x="13" y="139" width="14" height="43" rx="7" fill="url(#android)"/>
  <rect x="77" y="139" width="14" height="43" rx="7" fill="url(#android)"/>
  <circle cx="39" cy="118" r="4.2" fill="#fff"/>
  <circle cx="64" cy="118" r="4.2" fill="#fff"/>
  <path d="M23 132 H81" stroke="#0d9f42" stroke-width="4" opacity=".85"/>
</g>

<!-- Phone -->
<g filter="url(#shadow)">
  <rect x="59" y="16" width="142" height="224" rx="28" fill="url(#phoneFrame)"/>
  <rect x="64" y="21" width="132" height="214" rx="24" fill="#d8f6ff"/>
  <rect x="69" y="26" width="122" height="204" rx="20" fill="url(#phoneScreen)"/>
  <path d="M69 57 C93 30 132 26 181 26 L69 150 Z" fill="#35b6ff" opacity=".18"/>
  <rect x="112" y="33" width="36" height="6" rx="3" fill="#4fd0ff" opacity=".95"/>
  <circle cx="130" cy="220" r="4.4" fill="#1aa1ff"/>
</g>

<!-- Parcel -->
<g filter="url(#shadow)">
  <polygon points="95,92 129,73 164,92 130,111" fill="url(#boxTop)"/>
  <polygon points="95,92 130,111 130,151 95,132" fill="url(#boxLeft)"/>
  <polygon points="130,111 164,92 164,132 130,151" fill="url(#boxRight)"/>
  <polygon points="116,80 126,75 161,94 151,100" fill="url(#tape)"/>
  <polygon points="151,100 161,94 161,116 151,122" fill="#0cad50"/>
  <polygon points="130,111 137,107 137,147 130,151" fill="#84f235"/>
</g>

<!-- Magnifying glass -->
<g filter="url(#shadow)">
  <line x1="205" y1="206" x2="238" y2="239" stroke="#073d9f" stroke-width="18" stroke-linecap="round"/>
  <line x1="205" y1="206" x2="238" y2="239" stroke="url(#handle)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="177" cy="176" r="48" fill="#dff7ff"/>
  <circle cx="177" cy="176" r="42" fill="#0b57d0"/>
  <circle cx="177" cy="176" r="36" fill="url(#lens)"/>
  <path d="M153 177 L169 193 L201 158" fill="none" stroke="#91ff30" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="163" cy="157" rx="16" ry="7" transform="rotate(-35 163 157)" fill="#6fddff" opacity=".55"/>
</g>
</svg>
